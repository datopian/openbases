<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 454" width="900" height="454" role="img" aria-label="How OpenBases works: four layers (you, the work graph, the runner, the foundations). Work is filed at the top, an agent makes the change in a sandbox, the platform opens a pull request, and you review and merge.">
  <title>How OpenBases works</title>
  <style>
    svg{font-family:Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .b0{fill:#f4f4f5}.b1{fill:#d4d4d8}.b2{fill:#52525b}.b3{fill:#0a0a0a}
    .t0,.t1{fill:#0a0a0a}.t2,.t3{fill:#fafafa}
    .m0,.m1{fill:#52525b}.m2{fill:#d4d4d8}.m3{fill:#a1a1aa}
    .ttl{font-size:22px;font-weight:650;letter-spacing:-.4px}
    .sub{font-size:14.5px}
    .mono{font-size:12px;font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
    .step{font-size:14px;font-weight:550}
    .num{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
    .rail{stroke:#a1a1aa;stroke-width:1.5}
    .dot{fill:#0a0a0a;stroke:#fafafa;stroke-width:2}
    @media (prefers-color-scheme: dark){
      .b0{fill:#18181b}.b1{fill:#3f3f46}.b2{fill:#a1a1aa}.b3{fill:#fafafa}
      .t0,.t1{fill:#fafafa}.t2,.t3{fill:#0a0a0a}
      .m0,.m1{fill:#a1a1aa}.m2{fill:#27272a}.m3{fill:#52525b}
      .rail{stroke:#71717a}.dot{fill:#fafafa;stroke:#0a0a0a}
    }
  </style>
  <rect class="b0" x="20" y="20" width="860" height="96" rx="14"/>
  <text class="t0 ttl" x="48" y="56">You</text>
  <text class="t0 sub" x="48" y="80">People and their assistants: Claude, Codex, a browser.</text>
  <text class="m0 mono" x="48" y="100">ask · file · review · decide</text>
  <rect class="b1" x="20" y="126" width="860" height="96" rx="14"/>
  <text class="t1 ttl" x="48" y="162">Work graph</text>
  <text class="t1 sub" x="48" y="186">Projects, beads and what blocks what.</text>
  <text class="m1 mono" x="48" y="206">Beads on Dolt · PostgreSQL, row-level security</text>
  <rect class="b2" x="20" y="232" width="860" height="96" rx="14"/>
  <text class="t2 ttl" x="48" y="268">Runner</text>
  <text class="t2 sub" x="48" y="292">Budgeted, sandboxed agent runs.</text>
  <text class="m2 mono" x="48" y="312">OpenCode or Claude Code · one cell per trust domain</text>
  <rect class="b3" x="20" y="338" width="860" height="96" rx="14"/>
  <text class="t3 ttl" x="48" y="374">Foundations</text>
  <text class="t3 sub" x="48" y="398">Identity, spend and code hosting.</text>
  <text class="m3 mono" x="48" y="418">Cloudflare Access · AI Gateway · GitHub</text>
  <line class="rail" x1="626" y1="53.5" x2="626" y2="386.5" stroke-dasharray="2 5" stroke-linecap="round"/>
  <circle class="dot" cx="626" cy="53.5" r="5"/>
  <text class="t0 step" x="644" y="58"><tspan class="num m0">1</tspan>  File the work</text>
  <circle class="dot" cx="626" cy="83.5" r="5"/>
  <text class="t0 step" x="644" y="88"><tspan class="num m0">5</tspan>  Review and merge</text>
  <circle class="dot" cx="626" cy="174.5" r="5"/>
  <text class="t1 step" x="644" y="179.0"><tspan class="num m1">2</tspan>  Ready work is picked up</text>
  <circle class="dot" cx="626" cy="280.5" r="5"/>
  <text class="t2 step" x="644" y="285.0"><tspan class="num m2">3</tspan>  An agent makes the change</text>
  <circle class="dot" cx="626" cy="386.5" r="5"/>
  <text class="t3 step" x="644" y="391.0"><tspan class="num m3">4</tspan>  The platform opens the PR</text>
</svg>
