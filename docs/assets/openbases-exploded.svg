<polyline class="lead" points="130.3,-68.3 164.3,-94.3 176.3,-94.3"/>
<text class="ann" x="180.3" y="-90.3" text-anchor="start">No model calls in the plumbing.</text>
<text class="annsub" x="180.3" y="-75.3" text-anchor="start">dispatch, health, reconcile: plain code</text>
<circle class="pin" cx="30.3" cy="-54.3" r="2.6"/>
<polyline class="lead" points="30.3,-54.3 70.3,-24.3 82.3,-24.3"/>
<text class="ann" x="86.3" y="-20.3" text-anchor="start">Budget checked before every run.</text>
<text class="annsub" x="86.3" y="-5.3" text-anchor="start">bead, then project, then cell; unknown = refuse</text>
<circle class="pin" cx="-60.6" cy="29.7" r="2.6"/>
<polyline class="lead" points="-60.6,29.7 -100.6,69.8 -112.6,69.8"/>
<text class="ann" x="-116.6" y="73.8" text-anchor="end">One cell per trust domain.</text>
<text class="annsub" x="-116.6" y="88.8" text-anchor="end">own Linux user, cgroups, no view of others</text>
<circle class="pin" cx="-33.3" cy="8.7" r="2.6"/>
<polyline class="lead" points="-33.3,8.7 -123.3,-1.3 -135.3,-1.3"/>
<text class="ann" x="-139.3" y="2.7" text-anchor="end">Agents edit. They can't run git.</text>
<text class="annsub" x="-139.3" y="17.7" text-anchor="end">OpenCode or Claude Code, any gateway model</text>
<circle class="pin" cx="171.3" cy="184.6" r="2.6"/>
<polyline class="lead" points="171.3,184.6 195.3,224.6 207.3,224.6"/>
<text class="ann" x="211.3" y="228.6" text-anchor="start">The platform opens the PR.</text>
<text class="annsub" x="211.3" y="243.6" text-anchor="start">one repo, one token, under an hour</text>
<circle class="pin" cx="-184.1" cy="-299.2" r="2.6"/>
<polyline class="lead" points="-184.1,-299.2 -204.1,-259.2 -216.1,-259.2"/>
<text class="ann" x="-220.1" y="-255.2" text-anchor="end">You review and merge.</text>
<text class="annsub" x="-220.1" y="-240.2" text-anchor="end">nothing approves itself</text>
