<svg xmlns="http://www.w3.org/2000/svg" viewBox="-449 -347 918 621" width="918" height="621" role="img" aria-label="Exploded view of OpenBases: a control plane (work graph, budgets, identity) floats above sandboxed execution cells where agents edit code; the platform opens pull requests on GitHub and a person reviews and merges.">
