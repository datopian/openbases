<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="OpenBases">
  <title>OpenBases</title>
  <style>
    svg{color:#0a0a0a} .ink{fill:currentColor}
    @media (prefers-color-scheme: dark){svg{color:#fafafa}}
  </style>
  <defs>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0" stop-color="currentColor" stop-opacity=".16"/>
      <stop offset=".5" stop-color="currentColor" stop-opacity=".85"/>
      <stop offset=".62" stop-color="currentColor"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="50" cy="50" r="48"/></clipPath>
  </defs>
  <g clip-path="url(#disc)" fill="url(#fade)"><rect x="0" y="2" width="100" height="16"/><rect x="0" y="22" width="100" height="16"/><rect x="0" y="42" width="100" height="16"/><rect x="0" y="62" width="100" height="16"/><rect x="0" y="82" width="100" height="16"/></g>
</svg>
