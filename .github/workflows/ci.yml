name: ci

on:
  push:
    branches: [main]
  pull_request:

# Runs on Datopian's own runner rather than GitHub's hosted fleet.
#
# GitHub bills hosted runners per minute, so cost rises with use and a busy
# month hits a spending limit and blocks every repository — which is what
# happened here: $35 over 143 job-hours, then CI stopped mid-work. The runner
# is a Hetzner box at a flat EUR 10.49/month whatever it runs, so a budget can
# no longer switch CI off.
#
# `ubuntu-latest` cannot be redirected to it: GitHub always routes that label
# to its own fleet and it cannot be shadowed, so every job has to say
# self-hosted explicitly.
#
# The runner is arm64. Everything this workflow needs publishes an arm64 build
# — the pinned gt, bd and dolt all declare linux_arm64 in versions.lock, and
# pgvector/pgvector ships arm64 for pg16 — and scripts/lockfile.sh already
# selects by uname. A step that pulls an amd64-only binary will fail here.
#
# See github.com/datopian/self-hosted-runner-hetzner

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out="$(gofmt -l ./cmd ./internal)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: unit tests with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: build binaries
        run: make build

  web:
    name: web
    runs-on: self-hosted
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  database:
    name: database
    runs-on: self-hosted
    services:
      postgres:
        # pgvector is required by 0007_projections.sql. The stock postgres image
        # does not ship the extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: workgraph
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      PGPASSWORD: ci
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: workgraph
    steps:
      - uses: actions/checkout@v4

      # Go, because this job now builds the cost importer and runs it against
      # the service database.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: structural migration checks
        run: bash scripts/check_migrations.sh

      # CI connects as postgres, a superuser, and a superuser never evaluates
      # row-level security — FORCE ROW LEVEL SECURITY does not change that. So a
      # visibility test that forgets to drop to workgraph_app passes whether the
      # policies are right, wrong, or absent. This asserts that every test which
      # reads a protected table either drops privileges AND proves it took
      # effect, or is recorded as owner-only with the reason (wg-8yv.50).
      - name: integration tests exercise RLS rather than bypassing it
        run: python3 scripts/check_rls_tests.py

      # A variable written into a deployed environment file that no Go file
      # mentions is a setting that does nothing. WG_PUBSUB_PUSH_AUDIENCE was in
      # that state for a week: the file set it, the struct declared it, the
      # consumer checked it, and nothing read it — so the Pub/Sub push endpoint
      # was never registered and every delivery was refused.
      - name: every deployed environment variable is read by the code
        run: python3 scripts/check_env_wired.py

      # Applying against a real PostgreSQL is what catches a migration that
      # parses but cannot run.
      - name: apply migrations to an empty database
        run: |
          set -euo pipefail
          for f in db/migrations/*.sql; do
            echo "applying $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # Re-applying must not be destructive; this is the cheapest guard against
      # a migration that only works on a virgin database.
      - name: assert migrations are individually transactional
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM pg_tables WHERE schemaname='public'" \
            | { read -r n; echo "tables created: $n"; [ "$n" -ge 35 ]; }

      # The invariants are the point of the schema. If these stop being
      # enforced, the application's guarantees are gone whatever the code says.
      - name: schema invariants refuse what they must refuse
        run: psql -v ON_ERROR_STOP=1 -f test/integration/invariants.sql

      - name: knowledge, approval and credential invariants
        run: psql -v ON_ERROR_STOP=1 -f test/integration/knowledge_invariants.sql

      - name: cross-project isolation under row-level security
        run: psql -v ON_ERROR_STOP=1 -f test/integration/rls_isolation.sql

      # The pilot registry, asserted against the seeded data rather than
      # synthetic fixtures: three projects, distinct owners, and a restricted
      # client engagement invisible to a non-member.
      - name: pilot registry and restricted-project isolation
        run: psql -v ON_ERROR_STOP=1 -f test/integration/pilot_registry.sql

      # Company management reads every project, client-restricted ones
      # included. Asserted deliberately because it is invisible from any single
      # policy -- can_read_project mentions the roles once and every table that
      # delegates to it inherits the reach -- and because it is the kind of
      # access somebody tightens as an obvious improvement. Two earlier tests
      # tried to use a real person as an outsider and passed for the wrong
      # reason: everybody available was management.
      - name: company management reads every project, and nobody else does
        run: psql -v ON_ERROR_STOP=1 -f test/integration/management_access.sql

      - name: first-login identity linking
        run: psql -v ON_ERROR_STOP=1 -f test/integration/identity_linking.sql

      - name: cross-graph links and work-reference identity
        run: psql -v ON_ERROR_STOP=1 -f test/integration/hq_graph.sql

      - name: pull request and CI projections
        run: psql -v ON_ERROR_STOP=1 -f test/integration/projections.sql

      - name: projection visibility and the system path
        run: psql -v ON_ERROR_STOP=1 -f test/integration/reconciliation.sql

      - name: approvals, digest binding and who may decide
        run: psql -v ON_ERROR_STOP=1 -f test/integration/approvals.sql

      - name: chief-of-staff scoping
        run: psql -v ON_ERROR_STOP=1 -f test/integration/chiefofstaff.sql

      - name: agent health escalation and deduplication
        run: psql -v ON_ERROR_STOP=1 -f test/integration/agent_health.sql

      - name: credential registry holds references, not values
        run: psql -v ON_ERROR_STOP=1 -f test/integration/credential_registry.sql

      # The acceptance criterion for WP-I1 is that an alert REACHES the operator
      # with a runbook link, which is a property of the delivery path rather than
      # of the code that computes the alert.
      - name: platform alerts reach an operator with a runbook
        run: psql -v ON_ERROR_STOP=1 -f test/integration/platform_alerts.sql

      # Registering the nodes and cells that exist on disk, and the refusal to
      # guess which project a shared cell belongs to.
      - name: execution nodes and cells register, and attribution refuses to guess
        run: psql -v ON_ERROR_STOP=1 -f test/integration/execution_registry.sql

      # Budget resolution and summation: the most specific budget wins, and
      # spend is summed at that same level. If those two ever disagree, ten
      # beads can each spend the project's whole budget and nothing trips.
      - name: per-bead budgets resolve and sum at the same level
        run: psql -v ON_ERROR_STOP=1 -f test/integration/budgets.sql

      # The allow-list is the boundary for Workspace events, and the reconciler
      # reads it through SECURITY DEFINER functions because RLS would otherwise
      # show it an empty allow-list — which it would act on by deleting every
      # subscription that exists.
      - name: workspace event sources are allow-listed and read through the system path
        run: psql -v ON_ERROR_STOP=1 -f test/integration/workspace_events.sql

      # Two restricted client projects now exist, so "one client's material is
      # not visible to another" is finally a testable claim rather than an
      # aspiration. It is the case that matters more than an outsider leak.
      - name: a project's Workspace events are visible to its members and nobody else
        run: psql -v ON_ERROR_STOP=1 -f test/integration/workspace_event_visibility.sql

      # A review decides what enters company memory, so who may record one --
      # and under whose name -- is a security property, not a workflow detail.
      - name: only a project's members may review its candidates, as themselves
        run: psql -v ON_ERROR_STOP=1 -f test/integration/knowledge_review.sql

      # A reviewer can correct a candidate as well as decide on it: reclassify,
      # assign an owner, assign a project. Without those the queue's only
      # answer to "this is nearly right" is to throw it away, and the
      # transcript has already been ingested at that revision so it never
      # comes back. The limits are the interesting part -- tightening a
      # classification is allowed and widening is not.
      - name: a reviewer can reclassify and assign, but never widen
        run: psql -v ON_ERROR_STOP=1 -f test/integration/reviewer_corrections.sql

      # The same gap was found three times in one day, each by somebody
      # happening to look. This asks the database which tables hold
      # source-derived content and asserts each one is actually protected, so a
      # table added tomorrow is caught without anybody remembering to check.
      - name: every table holding source-derived content has a read policy
        run: psql -v ON_ERROR_STOP=1 -f test/integration/derived_content_rls.sql

      # Acceptance has to DO something, and has to do the right thing per type:
      # durable statements become records with provenance, operational ones are
      # bound for Beads and say so rather than vanishing.
      # Accepting one of EVERY durable type, because the type decides whether a
      # review date is required and only the exempt one was covered.
      - name: accepting a candidate publishes it with its provenance
        run: psql -v ON_ERROR_STOP=1 -f test/integration/durable_publication.sql

      # Publication of the operational half happens outside the database, so
      # what is testable here is the whole interface to the publisher: which
      # candidates are offered, which graph each routes to, which are refused,
      # and that recording the result twice does not create a second bead.
      # Routing is a confidentiality boundary -- a client's accepted commitment
      # must never fall back to the company graph.
      - name: an accepted operational candidate becomes work, exactly once
        run: psql -v ON_ERROR_STOP=1 -f test/integration/work_publication.sql

      # The cross-graph link layer. Beads graphs cannot reference each other,
      # so a company decision, a project epic and a personal follow-up can only
      # be related in the control plane -- and work_links had no row-level
      # security at all, because 0010 sweeps tables carrying a project_id and an
      # edge carries none.
      - name: work crossing graphs is linked in the control plane, under RLS
        run: psql -v ON_ERROR_STOP=1 -f test/integration/cross_graph_links.sql

      # The work overview is what a colleague sees when they log in, and both
      # of its functions are SECURITY DEFINER with no filter -- 0036's comment
      # said the visibility rule was written there and it was not. Asserted in
      # both directions: a filter that returns nothing to everybody would pass
      # a leak test and break the product.
      - name: the work overview shows only what the caller may see
        run: psql -v ON_ERROR_STOP=1 -f test/integration/work_overview_visibility.sql

      # Filing work into a project. Without the membership check anybody could
      # file into a client's project and then read it back, because the queue
      # is readable through the project (0071). A plan job has no bead, so the
      # overview needs the job's own project and not just its bead's.
      - name: a plan is filed into a project the requester belongs to, or not at all
        run: psql -v ON_ERROR_STOP=1 -f test/integration/plan_into_project.sql

      # The durable half. The pull request is a GitHub call, so what is
      # asserted here is the interface: the provenance that travels with a
      # record, that the excerpt TEXT does not, and that recording the
      # publication twice does not propose the same record again.
      - name: an accepted record is offered for Git once, with its provenance
        run: psql -v ON_ERROR_STOP=1 -f test/integration/record_publication.sql

      # Correcting company memory. The columns for supersession existed from
      # 0002 and nothing could reach them, which in practice means the first
      # correction anybody makes is an UPDATE and the evidence is gone.
      - name: correcting a record supersedes it rather than overwriting it
        run: psql -v ON_ERROR_STOP=1 -f test/integration/supersession.sql

      # Personal API tokens: who can see whose, revocation taking effect on the
      # next lookup, and the CHECK constraints biting. The constraints are the
      # reason this cannot be a Go test — wg-p4h.2 puts the ungrantable scopes
      # and the bounded lifetime in the schema precisely so a caller that skips
      # the Go validation still cannot store the row, and that claim is only
      # worth something if something proves it.
      - name: api tokens are scoped, revocable, and constrained
        run: psql -v ON_ERROR_STOP=1 -f test/integration/api_tokens.sql

      # The device authorization grant. Minting needs an interactive session,
      # which is right and which left a sandboxed agent nowhere to go. The
      # refusals are the interesting half: one approval, one redemption, an
      # unknown code that answers invalid_grant rather than leaking, and an
      # ungrantable scope refused before anybody is asked to approve it.
      - name: a device grant is approved once, redeemed once, and refuses the rest
        run: psql -v ON_ERROR_STOP=1 -f test/integration/device_authorization.sql

      # The invariant behind "I created a project and could not see it": both
      # owners are members, so the project is visible to the people responsible
      # for it and not only to the four administrators who see everything.
      - name: a created project is visible to both its owners and to nobody else
        run: psql -v ON_ERROR_STOP=1 -f test/integration/project_creation_visibility.sql

      # Attribution comes from the bead, not the cell. Creating two PoC projects
      # on the shared oss cell silently unattributed eighty beads, the Jackson
      # demo epic among them, and the only symptom was an empty column.
      - name: a bead is attributed by its label, and a shared cell abstains
        run: psql -v ON_ERROR_STOP=1 -f test/integration/bead_attribution.sql

      # `done` from the runner is not the same as the work being finished: three
      # real runs exited zero, left their beads open, and reported that they
      # could not proceed. The outcome tells those apart.
      - name: a bead's outcome tells done from ran-and-did-not-finish
        run: psql -v ON_ERROR_STOP=1 -f test/integration/bead_detail.sql

      # The cost importer, end to end against a stub gateway: paging, the
      # watermark, idempotency, sub-cent precision and the RLS boundary. It needs
      # the real binary rather than SQL alone, because the decisions being
      # asserted — what is skipped, what is flagged, how dollars become cents —
      # live in Go and would otherwise only be checked by hand on a node.
      - name: build the cost importer
        run: go build -o bin/costimport ./cmd/costimport

      - name: gateway spend becomes a durable, joinable, exact record
        run: bash test/acceptance/cost_import.sh bin/costimport

  toolchain:
    name: toolchain
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Installs gt, bd and dolt at exactly the pinned versions and fails on any
      # checksum mismatch. This is what stops an unvalidated upgrade reaching a
      # deployment (plan section 7.6).
      - name: install and verify the pinned matrix
        run: bash scripts/bootstrap.sh

      - name: verify versions match versions.lock
        run: PATH="$PWD/.toolchain/bin:$PATH" bash scripts/verify_versions.sh

      # The adapter's contract is a CLI, not a library: argument order, JSON
      # shapes and exit codes can all change upstream without the compiler
      # noticing. These run against the pinned binary, which is what makes a
      # version bump checkable rather than hopeful (plan section 7.6).
      - name: Beads adapter contract tests against the pinned binary
        run: |
          export PATH="$PWD/.toolchain/bin:$PATH"
          git config --global user.email "ci@datopian.com"
          git config --global user.name "CI"
          go test -run TestContract ./internal/beads/ -v

      # The gate a version bump must pass (versions.lock: requires_fixture).
      #
      # It proves the three pinned binaries work TOGETHER — the failure it
      # exists to catch is a bump that leaves each tool fine alone and the
      # combination broken. It runs offline against a local bare repository, so
      # it needs no network and no credentials, and it deliberately does not
      # dispatch an agent: that costs money on every push, and a CI job that
      # spends money is one somebody disables.
      - name: Gas Town / Beads / Dolt compatibility fixture
        run: |
          export PATH="$PWD/.toolchain/bin:$PATH"
          git config --global user.email "ci@datopian.com"
          git config --global user.name "CI"
          bash test/contract/compatibility/fixture.sh

  infrastructure:
    name: infrastructure
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.5

      - name: formatting
        run: tofu fmt -recursive -check -diff infra/tofu

      # Validation needs provider schemas but no credentials and no state.
      - name: validate modules and environments
        run: |
          set -euo pipefail
          for dir in infra/tofu/modules/* infra/tofu/envs/*; do
            [ -d "$dir" ] || continue
            echo "::group::$dir"
            tofu -chdir="$dir" init -backend=false -input=false >/dev/null
            tofu -chdir="$dir" validate
            echo "::endgroup::"
          done

      # Structural guards on the security posture: no inbound services, SSH
      # closed by default, nodes protected from casual destruction, and exactly
      # one DNS record in a zone full of unrelated live records.
      - name: infrastructure invariants
        run: python3 scripts/check_infra.py

      # A guard that cannot fail is read as evidence while defending nothing.
      # This asserts the bypass guard refuses each way a bypass could reach
      # production, and still passes on the real tree.
      - name: the Access bypass guard fails when it should
        run: bash test/acceptance/access_bypass_guard.sh

      # SOPS encrypts by key NAME, which makes the naming a security boundary.
      # Needs no key material: it reads ciphertext markers, never decrypts.
      - name: encrypted secrets
        run: python3 scripts/check_secrets_encrypted.py

  security:
    name: security
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: secret scan
        run: bash scripts/secret_scan.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # The interface's dependencies were not scanned by anything. govulncheck
      # covers Go only, and the web application ships to a browser as part of
      # the control API binary, so a vulnerable package there is served to every
      # authenticated user (WP-I3).
      #
      # Dev dependencies are included deliberately. They do not reach the
      # browser, but they run in CI with repository access, which is its own
      # exposure — a compromised build tool is a supply-chain problem whether or
      # not it ends up in the bundle.
      - uses: actions/setup-node@v4
        with:
          # Matches the web job. There is no .nvmrc; pinning it in two places is
          # a small duplication, and referencing a file that does not exist
          # would have failed the job on its first run.
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: dependency scan, web
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
