name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out="$(gofmt -l ./cmd ./internal)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: unit tests with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: build binaries
        run: make build

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  database:
    name: database
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector is required by 0007_projections.sql. The stock postgres image
        # does not ship the extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: workgraph
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      PGPASSWORD: ci
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: workgraph
    steps:
      - uses: actions/checkout@v4

      - name: structural migration checks
        run: bash scripts/check_migrations.sh

      # Applying against a real PostgreSQL is what catches a migration that
      # parses but cannot run.
      - name: apply migrations to an empty database
        run: |
          set -euo pipefail
          for f in db/migrations/*.sql; do
            echo "applying $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # Re-applying must not be destructive; this is the cheapest guard against
      # a migration that only works on a virgin database.
      - name: assert migrations are individually transactional
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM pg_tables WHERE schemaname='public'" \
            | { read -r n; echo "tables created: $n"; [ "$n" -ge 35 ]; }

      # The invariants are the point of the schema. If these stop being
      # enforced, the application's guarantees are gone whatever the code says.
      - name: schema invariants refuse what they must refuse
        run: psql -v ON_ERROR_STOP=1 -f test/integration/invariants.sql

      - name: knowledge, approval and credential invariants
        run: psql -v ON_ERROR_STOP=1 -f test/integration/knowledge_invariants.sql

      - name: cross-project isolation under row-level security
        run: psql -v ON_ERROR_STOP=1 -f test/integration/rls_isolation.sql

  toolchain:
    name: toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Installs gt, bd and dolt at exactly the pinned versions and fails on any
      # checksum mismatch. This is what stops an unvalidated upgrade reaching a
      # deployment (plan section 7.6).
      - name: install and verify the pinned matrix
        run: bash scripts/bootstrap.sh

      - name: verify versions match versions.lock
        run: PATH="$PWD/.toolchain/bin:$PATH" bash scripts/verify_versions.sh

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: secret scan
        run: bash scripts/secret_scan.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
