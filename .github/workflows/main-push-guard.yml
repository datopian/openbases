name: main-push-guard

# Compensating control for ADR-0016.
#
# Branch protection is unavailable on this plan, so a direct push to main cannot
# be prevented by GitHub. This job detects one and fails loudly, so that a
# bypass is visible in the run history rather than silent.

# ---------------------------------------------------------------------------
# THIS WORKFLOW CANNOT RUN WHILE THE REPOSITORY IS PUBLIC. Decided 2026-09-08.
#
# It needs a self-hosted runner, and the org runner group sets
# allows_public_repositories=false. That flag gates on repository VISIBILITY,
# not on the trigger -- so it blocks this workflow even though no fork can
# trigger it (a fork cannot push to main, and schedules only ever run on the
# base repository's default branch). Jobs queue indefinitely against idle
# runners rather than failing, which is why this notice is here and not in a
# commit message somebody would have to find.
#
# The alternative was allows_public_repositories=true, with pull-request CI
# already moved to GitHub's hosted fleet and fork runs gated on maintainer
# approval. That was declined deliberately: no fork code on Datopian machines,
# at the price of these workflows.
#
# CONSEQUENCE: a direct push to main is no longer reported by CI.
# The pre-push hook is the only remaining guard, and it is local and
# bypassable with --no-verify.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Runs on Datopian's own runner rather than GitHub's hosted fleet because
# it is push-only, so no fork can trigger it. (ci.yml moved to the hosted fleet on
# 2026-09-08; its old cost argument is no longer the reason -- see there.)
# Historical note, kept because it is still true of private repositories:
# for the same
# reason ci.yml does: a hosted runner is billed per minute, a busy month hits the
# spending limit, and every hosted job then fails in about four seconds with
# nothing useful in the log. This workflow was left behind when ci.yml moved, and
# had been failing on every run since — silently, because a guard that always
# fails stops being read.

jobs:
  guard:
    name: every commit on main came from a pull request
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: check pushed commits against merged pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # The very first push to a branch has an all-zero "before" SHA and no
          # ancestor to diff against. Bootstrap commits are covered by ADR-0016.
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "Initial push to main — nothing to compare against."
            exit 0
          fi

          commits="$(git rev-list "$BEFORE..$AFTER")"
          if [ -z "$commits" ]; then
            echo "No new commits."
            exit 0
          fi

          # Whether one commit arrived through a merged pull request.
          #
          # Both available answers race the merge, and the race is longer than it
          # looks. commits/{sha}/pulls is served by an index populated some time
          # after a squash merge lands, and pulls/{n}.merge_commit_sha holds a
          # TEST merge commit while the pull request is open. This job starts on
          # the push, three seconds after the merge; measured, both were still
          # negative a hundred seconds later and both were correct by the time
          # anyone looked.
          #
          # So this distinguishes two different things that were previously one:
          #
          #   a commit with NO pull request number in its subject cannot acquire
          #   one, and is a bypass now and for ever — reported immediately, and
          #   fails the job;
          #
          #   a commit that names a pull request the API has not caught up with
          #   yet is UNCONFIRMED, not proven innocent and not proven guilty. It
          #   is reported as a warning and does not fail the job.
          #
          # Failing on the second would mean failing on every merge, and a guard
          # that fires every time is a guard nobody reads — which would leave
          # ADR-0016 with no compensating control at all while appearing to have
          # one. Warning on it keeps the signal honest in both directions.
          confirm() {  # sha subject -> 0 confirmed, 1 unconfirmed
            local sha="$1" subject="$2" attempt prs number merged_sha
            number="$(printf '%s' "$subject" | sed -n 's/.*(#\([0-9][0-9]*\))$/\1/p')"
            for attempt in 1 2 3 4 5 6 7 8; do
              prs="$(gh api "repos/$REPO/commits/$sha/pulls" \
                       -H "Accept: application/vnd.github+json" \
                       --jq '[.[] | select(.merged_at != null)] | length' 2>/dev/null || echo 0)"
              [ "${prs:-0}" -gt 0 ] && return 0

              # The number alone proves nothing — anyone can type "(#1)" into a
              # commit message — so the pull request it names must ALSO be merged
              # and its merge commit must be this commit.
              if [ -n "$number" ]; then
                merged_sha="$(gh api "repos/$REPO/pulls/$number" \
                                -H "Accept: application/vnd.github+json" \
                                --jq 'select(.merged_at != null) | .merge_commit_sha' 2>/dev/null || true)"
                [ "$merged_sha" = "$sha" ] && return 0
              fi

              if [ "$attempt" -lt 8 ]; then
                sleep 15
              fi
            done
            return 1
          }

          bypassed=0
          unconfirmed=0
          for sha in $commits; do
            subject="$(git log -1 --format=%s "$sha")"
            short="$(git rev-parse --short "$sha")"

            if ! printf '%s' "$subject" | grep -qE '\(#[0-9]+\)$'; then
              # No pull request number at all. Nothing to wait for.
              echo "  BYPASS       $short  $subject"
              bypassed=1
              continue
            fi

            if confirm "$sha" "$subject"; then
              echo "  ok           $short  $subject"
            else
              echo "  UNCONFIRMED  $short  $subject"
              echo "               names a pull request the API has not yet associated;"
              echo "               re-run this job to confirm, or check it by hand."
              unconfirmed=1
            fi
          done

          if [ "$unconfirmed" -ne 0 ]; then
            echo
            echo "::warning::A commit names a pull request that could not be confirmed"
            echo "within the wait. This is usually the API lagging a squash merge."
          fi

          if [ "$bypassed" -ne 0 ]; then
            echo
            echo "A commit reached main without a merged pull request."
            echo
            echo "Branch protection is unavailable on the current GitHub plan (ADR-0016),"
            echo "so this is detection, not prevention. Either the commit was a recorded"
            echo "bootstrap or break-glass event, or the review process was bypassed."
            echo
            echo "Required: record a break-glass event with a named actor and open a"
            echo "follow-up pull request, or revert. See blocker Bead wg-8yv.30."
            exit 1
          fi

          echo
          echo "All pushed commits arrived through a merged pull request."
