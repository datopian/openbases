name: main-push-guard

# Compensating control for ADR-0016.
#
# Branch protection is unavailable on this plan, so a direct push to main cannot
# be prevented by GitHub. This job detects one and fails loudly, so that a
# bypass is visible in the run history rather than silent.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Runs on Datopian's own runner rather than GitHub's hosted fleet, for the same
# reason ci.yml does: a hosted runner is billed per minute, a busy month hits the
# spending limit, and every hosted job then fails in about four seconds with
# nothing useful in the log. This workflow was left behind when ci.yml moved, and
# had been failing on every run since — silently, because a guard that always
# fails stops being read.

jobs:
  guard:
    name: every commit on main came from a pull request
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: check pushed commits against merged pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # The very first push to a branch has an all-zero "before" SHA and no
          # ancestor to diff against. Bootstrap commits are covered by ADR-0016.
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "Initial push to main — nothing to compare against."
            exit 0
          fi

          commits="$(git rev-list "$BEFORE..$AFTER")"
          if [ -z "$commits" ]; then
            echo "No new commits."
            exit 0
          fi

          # Whether one commit arrived through a merged pull request.
          #
          # Asked twice, and retried, because BOTH answers race the merge.
          #
          # commits/{sha}/pulls is served by an index that is not populated the
          # instant a squash merge lands. And pulls/{n}.merge_commit_sha holds a
          # TEST merge commit while the pull request is open, becoming the real
          # one shortly after it is merged. This job runs on the push, seconds
          # later, so at that moment both can still disagree with reality: the
          # guard reported BYPASS for its own merge, seventeen seconds after it,
          # while the API served the correct values a minute afterwards.
          #
          # A guard that fires on every merge is a guard nobody reads, which
          # would leave ADR-0016 with no compensating control at all while
          # appearing to have one. So it waits instead of guessing.
          arrived_by_pr() {
            local sha="$1" subject="$2" attempt prs number merged_sha
            for attempt in 1 2 3 4 5 6; do
              prs="$(gh api "repos/$REPO/commits/$sha/pulls" \
                       -H "Accept: application/vnd.github+json" \
                       --jq '[.[] | select(.merged_at != null)] | length' 2>/dev/null || echo 0)"
              if [ "${prs:-0}" -gt 0 ]; then
                return 0
              fi

              # The number a squash merge writes into the subject. On its own it
              # proves nothing — anyone can type "(#1)" into a commit message —
              # so the pull request it names must ALSO be merged and its merge
              # commit must be this commit.
              number="$(printf '%s' "$subject" | sed -n 's/.*(#\([0-9][0-9]*\))$/\1/p')"
              if [ -n "$number" ]; then
                merged_sha="$(gh api "repos/$REPO/pulls/$number" \
                                -H "Accept: application/vnd.github+json" \
                                --jq 'select(.merged_at != null) | .merge_commit_sha' 2>/dev/null || true)"
                if [ "$merged_sha" = "$sha" ]; then
                  return 0
                fi
              fi

              # Only worth waiting if there is something that might yet resolve.
              # A commit with no pull request number in its subject and no
              # association will not grow one, so a real bypass is reported at
              # once rather than after a minute of politeness.
              if [ -z "$number" ]; then
                return 1
              fi
              [ "$attempt" -lt 6 ] && sleep 10
            done
            return 1
          }

          bypassed=0
          for sha in $commits; do
            subject="$(git log -1 --format=%s "$sha")"
            if arrived_by_pr "$sha" "$subject"; then
              echo "  ok       $(git rev-parse --short "$sha")  $subject"
            else
              echo "  BYPASS   $(git rev-parse --short "$sha")  $subject"
              bypassed=1
            fi
          done

          if [ "$bypassed" -ne 0 ]; then
            echo
            echo "A commit reached main without a merged pull request."
            echo
            echo "Branch protection is unavailable on the current GitHub plan (ADR-0016),"
            echo "so this is detection, not prevention. Either the commit was a recorded"
            echo "bootstrap or break-glass event, or the review process was bypassed."
            echo
            echo "Required: record a break-glass event with a named actor and open a"
            echo "follow-up pull request, or revert. See blocker Bead wg-8yv.30."
            exit 1
          fi

          echo
          echo "All pushed commits arrived through a merged pull request."
