name: staging-deploy

# Every merge to main deploys automatically to staging (plan section 16.4).
#
# EXCEPT THAT IT DOES NOT, TODAY. This workflow queues forever and deploys
# nothing; staging is deployed by hand. The first line stayed true-sounding for
# two days while every run sat pending, so it is contradicted here rather than
# quietly left. See the block below, and docs/runbooks/deploying.md.
# The job is gated on the staging environment actually existing: until WP-B1
# provisions it, the job skips rather than reporting a deployment that did not
# happen.

# ---------------------------------------------------------------------------
# THIS WORKFLOW CANNOT RUN WHILE THE REPOSITORY IS PUBLIC. Decided 2026-09-08,
# and unlike the other three, still true on 2026-09-10.
#
# It needs a self-hosted runner, and the org runner group sets
# allows_public_repositories=false. That flag gates on repository VISIBILITY,
# not on the trigger -- so it blocks this workflow even though no fork can
# trigger it. Jobs queue indefinitely against idle runners rather than failing.
#
# external-probe, main-push-guard and toolchain-upgrade moved to GitHub's
# hosted fleet, because none of them touches this infrastructure. This one
# cannot follow them: it runs ansible against the nodes through an SSH
# ProxyCommand, and it needs scripts/with_secrets.sh, which needs the age
# private key. Putting that key in GitHub would hand every secret this project
# has to whoever compromises an Actions runner -- a strictly worse trade than
# deploying by hand.
#
# So deploys are manual, and that is a deliberate position rather than a gap
# waiting to be filled:
#
#   cd infra/ansible
#   ../../scripts/with_secrets.sh staging \
#     ansible-playbook -i inventory/staging.yml site.yml
#
# What would change it: a self-hosted runner in a group that permits public
# repositories, holding no fork code -- which is an org-level decision about
# runner isolation, not a change to this file.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

# Runs on Datopian's own runner rather than GitHub's hosted fleet, for the same
# reason ci.yml does: a hosted runner is billed per minute, a busy month hits the
# spending limit, and every hosted job then fails in about four seconds with
# nothing useful in the log. This workflow was left behind when ci.yml moved, and
# had been failing on every run since — silently, because a guard that always
# fails stops being read.

jobs:
  deploy:
    name: deploy to staging
    if: vars.STAGING_PROVISIONED == 'true'
    runs-on: self-hosted
    environment: staging
    steps:
      - uses: actions/checkout@v4

      # Images are built on GitHub-hosted runners. A privileged self-hosted
      # runner must never execute untrusted pull request code (plan section 16.2).
      - name: build and push image
        run: |
          echo "image build and push land with WP-B1/WP-I1"
          exit 1

      - name: deploy by immutable digest
        run: |
          echo "deployment triggers the host pull through a Cloudflare-protected endpoint"
          exit 1

      - name: smoke tests
        run: echo "smoke tests land with WP-I1"

  not-provisioned:
    name: staging not provisioned
    if: vars.STAGING_PROVISIONED != 'true'
    runs-on: self-hosted
    steps:
      - name: explain
        run: |
          echo "Staging is not provisioned yet, so there is nothing to deploy to."
          echo "WP-B1 provisions it and sets the STAGING_PROVISIONED repository variable."
