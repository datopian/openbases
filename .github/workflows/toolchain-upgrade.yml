name: toolchain-upgrade

# A scheduled workflow may open an upgrade pull request. It must never deploy
# one (plan section 7.6). The compatibility fixture runs on the resulting PR
# like any other change, and a human approves it.

# ---------------------------------------------------------------------------
# THIS WORKFLOW CANNOT RUN WHILE THE REPOSITORY IS PUBLIC. Decided 2026-09-08.
#
# It needs a self-hosted runner, and the org runner group sets
# allows_public_repositories=false. That flag gates on repository VISIBILITY,
# not on the trigger -- so it blocks this workflow even though no fork can
# trigger it (a fork cannot push to main, and schedules only ever run on the
# base repository's default branch). Jobs queue indefinitely against idle
# runners rather than failing, which is why this notice is here and not in a
# commit message somebody would have to find.
#
# The alternative was allows_public_repositories=true, with pull-request CI
# already moved to GitHub's hosted fleet and fork runs gated on maintainer
# approval. That was declined deliberately: no fork code on Datopian machines,
# at the price of these workflows.
#
# CONSEQUENCE: gt, bd and dolt are no longer checked for upgrades.
# versions.lock will drift silently until someone looks.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Runs on Datopian's own runner rather than GitHub's hosted fleet because
# it is scheduled, so no fork can trigger it. (ci.yml moved to the hosted fleet on
# 2026-09-08; its old cost argument is no longer the reason -- see there.)
# Historical note, kept because it is still true of private repositories:
# for the same
# reason ci.yml does: a hosted runner is billed per minute, a busy month hits the
# spending limit, and every hosted job then fails in about four seconds with
# nothing useful in the log. This workflow was left behind when ci.yml moved, and
# had been failing on every run since — silently, because a guard that always
# fails stops being read.

jobs:
  check:
    name: check for newer pinned versions
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: compare versions.lock against upstream releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source scripts/lockfile.sh

          report=""
          for pair in "gastown gastownhall/gastown" "beads gastownhall/beads" "dolt dolthub/dolt"; do
            set -- $pair
            tool="$1"; repo="$2"
            pinned="$(lock_version "$tool")"
            latest="$(gh api "repos/$repo/releases/latest" --jq .tag_name 2>/dev/null || echo "$pinned")"
            if [ "$pinned" != "$latest" ]; then
              report="${report}- ${tool}: pinned ${pinned}, upstream ${latest}"$'\n'
            fi
          done

          if [ -n "$report" ]; then
            echo "Newer releases are available:"
            echo "$report"
            echo
            echo "An upgrade requires the whole matrix to move together, the compatibility"
            echo "fixture to pass in staging, and human approval. Opening the upgrade PR is"
            echo "delivered by WP-E2; this job reports the drift so it is never silent."
          else
            echo "versions.lock matches the latest upstream releases."
          fi
