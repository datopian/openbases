# Agent runtimes — the CLIs that actually execute model output (ADR-0024).
#
# A separate section, NOT part of the matrix above, and the distinction matters.
# The matrix moves as a unit because gt declares exact compatibility with bd and
# a minimum for dolt; rolling one back means rolling all three. An agent runtime
# declares nothing about the others and can be bumped on its own, so filing it
# under `matrix` would make every OpenCode release a matrix bump and quietly
# devalue the rule that a matrix bump needs the compatibility fixture.
#
# Pinned for a sharper reason than libraries are. This is not a dependency the
# services import; it is the process that runs an agent with file-write access
# inside a cell. An unpinned upgrade to it is a change to what our agents can
# do, arriving without a pull request.
#
# Digests are the publisher-reported SHA-256 from the GitHub release API, read
# on 2026-08-27.
runtimes:
  # Node, which is here rather than in the matrix for the same reason OpenCode
  # is: it declares nothing about gt, bd or dolt and moves on its own.
  #
  # It is pinned for a different reason from the others, though, and the
  # difference is worth stating. gt, bd, dolt and OpenCode are pinned because
  # they run our agents. Node is pinned because it runs OTHER PEOPLE'S code: a
  # repository check invokes the repository's own build or test command, and
  # the version has to be the one that repository expects. Debian ships 18;
  # portaljs declares `node: >=22` and npm refuses it outright. A check failing
  # on the node's Node version fails for a reason unrelated to the change,
  # which is the failure mode that took `npm audit` out of CI.
  #
  # 22 is the current LTS line (Jod) and what PortalJS's own CI builds against.
  # Digest from nodejs.org/dist/v22.23.2/SHASUMS256.txt, read on 2026-09-07.
  node:
    version: "v22.23.2"
    repository: "nodejs/node"
    artefacts:
      linux_amd64:
        file: "node-v22.23.2-linux-x64.tar.xz"
        sha256: "d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307"

  opencode:
    version: "v1.18.23"
    repository: "anomalyco/opencode"
    # Reaches any gateway provider through /compat. Proven to carry attribution
    # in wg-uhj; used by wg-runner's opencode runtime.
    artefacts:
      linux_amd64:
        file: "opencode-linux-x64.tar.gz"
        sha256: "ab7015cd8113e011a461f30a0c2b77d8299a144ff688cb62e93e8802835d7288"
      linux_arm64:
        file: "opencode-linux-arm64.tar.gz"
        sha256: "86d3afaf4e8784f9adab189be2a315c12b27ec40a04b70defbe70595c3cc7c65"

  claude_code:
    # Was unpinned: the Ansible task installed the npm package with `state:
    # present` and no version, so a node got whatever was latest the day it was
    # first built and kept it. Two nodes built a month apart ran different
    # agents, and neither was recorded anywhere.
    #
    # Pinned at the version already deployed, so adopting this changes nothing
    # today and makes the next change deliberate. npm verifies the package
    # integrity hash itself, which is why there is no sha256 here.
    version: "2.1.232"
    package: "@anthropic-ai/claude-code"

# Language and build toolchain, pinned so that CI, local development, and the
# release image agree.
toolchain:
  # Bumped as advisories land. 1.26.0 was vulnerable, then 1.26.5; GO-2026-6218
  # (net/url) and GO-2026-6090 (crypto/tls) are fixed in 1.26.6, and both were
  # reachable — from the JWKS fetch and from agentd's TLS listener.
  go: "1.26.6"
  node: "22"

# Upgrade procedure (plan section 7.6). The fixture must:
#   initialise a town and rig; create and link beads; query ready work;
#   dispatch a worker; survive agent termination and handoff; create a PR;
#   close work; perform backup and restore; verify projections and audit events.
upgrade:
  requires_fixture: "test/contract/compatibility"
  auto_deploy: false
  rollback_unit: "whole matrix"
