# versions.lock — the validated Gas Town / Beads / Dolt compatibility matrix.
#
# Plan sections 1.4 and 7.6:
#   - pin gt, bd and dolt by exact version and checksum;
#   - download only release artefacts and verify checksums before install;
#   - never use "latest" in production;
#   - a scheduled workflow may open an upgrade PR but must never deploy it;
#   - roll back the entire matrix, not one binary.
#
# The matrix moves together. Bumping one entry without running the compatibility
# fixture in staging is a policy violation, not a convenience.
#
# Digests below were read from the GitHub release API on 2026-08-10 and are the
# publisher-reported SHA-256 of each release artefact.

version: 1
verified_at: "2026-08-10"

matrix:
  gastown:
    version: "v1.2.0"
    repository: "gastownhall/gastown"
    # v1.2.1 exists upstream. It is deliberately not adopted: an upgrade goes
    # through the compatibility fixture and an approved PR (plan section 7.6).
    declares:
      beads: "v1.0.4"          # exact — gt 1.2.0 fails fast on a newer bd
      dolt_minimum: "2.0.7"
    artefacts:
      linux_amd64:
