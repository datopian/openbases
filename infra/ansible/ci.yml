---
# The shared GitHub Actions runner for Datopian repositories.
#
# A separate playbook from site.yml because it is separate infrastructure in a
# separate Hetzner project, and running it must never be able to touch the
# Workgraph nodes by accident — which a --limit typo in a combined playbook
# eventually would.
- name: Configure the CI runner
  hosts: ci_runners
  become: false
  gather_facts: true
  roles:
    - base
    - ssh
    - ci_runner
