---
# WP-B2: host provisioning and hardening.
#
# Idempotent by requirement: a second run must report no changes. Run it twice
# and compare, or use scripts/ansible_check.sh which does that for you.

# Before anything installs a binary: refuse a deploy that would install none.
#
# Every `*_local_binary` resolves through first_found against bin/linux-amd64
# and falls back to "", and every install task skips on empty. That contract is
# deliberate -- a config-only deploy should not fail on a missing source file --
# and it has a sharp edge, which has now drawn blood twice:
#
#   the worker binary was never wired to a variable at all, so the install task
#   skipped on every deploy and reported ok. Staging ran a 22 August binary for
#   two and a half weeks (see group_vars/all/binaries.yml);
#
#   on 9 September a full site.yml run finished in 11m02s with failed=0 while
#   installing no new wg-runner, because bin/linux-amd64 had not been rebuilt
#   since the merge. The deploy was reported as done, and the node was running
#   the previous binary.
#
# Both are the same shape: a guard whose input is silently absent. An empty
# build directory is not a partial deploy, it is a deploy that ships nothing
# and says it worked, so it fails here instead -- naming the fix.
#
# Tagged the same as the install tasks, so a run that installs no binaries by
# choice (`--tags config`) never reaches this.
- name: Refuse a binary deploy with nothing built
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tags: [binaries, code]
  tasks:
    - name: Count what is in the build directory
      ansible.builtin.find:
        paths: "{{ workgraph_build_dir }}"
        file_type: file
      register: built
      failed_when: false

    - name: There must be at least one binary to install
      ansible.builtin.assert:
        that: built.matched | default(0) > 0
        fail_msg: >-
          {{ workgraph_build_dir }} holds no binaries, so this deploy would
          install none and still report success. Run `make build-linux` first.
          If you meant to deploy configuration only, say so:
          --skip-tags binaries.
        success_msg: "{{ built.matched }} binaries ready to install"

    # Present is not the same as current.
    #
    # A deploy of the filing endpoint installed binaries built before the
    # merge: fifteen files were there, the count guard passed, ansible
    # reported failed=0, and the node went on running the previous build --
    # visible only because migrate said "found 99" when the repository held
    # a hundred. Counting files cannot tell a fresh build from a stale one.
    - name: Find the newest source file
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../.."
        patterns: ["*.go", "*.sql"]
        excludes: ["*_test.go"]
        recurse: true
      register: sources
      failed_when: false

    - name: The binaries must be newer than the code they were built from
      vars:
        newest_binary: "{{ built.files | map(attribute='mtime') | max | default(0) }}"
        newest_source: "{{ sources.files | map(attribute='mtime') | max | default(0) }}"
      ansible.builtin.assert:
        that: newest_binary | float >= newest_source | float
        fail_msg: >-
          {{ workgraph_build_dir }} is older than the source it was built
          from, so this deploy would install the PREVIOUS build and report
          success. Run `make build-linux` and deploy again.
        success_msg: >-
          the build is newer than every source file

- name: Harden every node
  hosts: all
  become: false          # cloud-init leaves us as root; no sudo layer to add
  gather_facts: true
  roles:
    - base
    - ssh
    - auditd

- name: Provision the control-plane database
  hosts: control
  become: false
  gather_facts: true
  roles:
    - postgresql
    - beads_hq
    - control_api
    # After control_api: the monitor reads its environment file and its database
    # credential, and probes its health endpoint.
    - monitor
    # After control_api for the same reason: it reads that environment file for
    # the DSN and that credential directory for the database password.
    - costimport
    # After postgresql (it reconfigures WAL archiving) and beads_hq (it backs up
    # the graph that role creates).
    - backup

- name: Configure execution cells
  hosts: execution
  become: false
  gather_facts: true
  roles:
    - execution_cell
    - gastown

# A play of its own, on the control node, AFTER the execution play.
#
# The registry records the limits actually APPLIED to each cell, and those are
# derived from the node's real CPU and memory as a set_fact during the play
# above. Running this earlier would record the declared numbers instead, which on
# this hardware were ceilings above the machine and could never be reached.
- name: Record the execution registry
  hosts: control
  become: false
  gather_facts: false
  roles:
    - execution_registry

- name: Verify compliance
  hosts: all
  become: false
  gather_facts: false
  roles:
    - compliance
