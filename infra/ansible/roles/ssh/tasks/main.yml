---
# SSH hardening.
#
# SSH is reachable only through Cloudflare Tunnel — the firewall admits nothing
# inbound — but the daemon must still be safe if that ever changes, and Access
# authenticates the connection rather than sshd.

- name: Harden sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-workgraph.conf
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
    content: |
      # Managed by Ansible (WP-B2). Do not edit on the host.
      PasswordAuthentication no
      PermitEmptyPasswords no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PubkeyAuthentication yes

      # Root login by key only. The tunnel path authenticates through Access
      # first, and break-glass has to be attributable, so this is deliberately
      # not "no" until per-person admin accounts exist.
      PermitRootLogin prohibit-password

      X11Forwarding no
      AllowAgentForwarding no
      AllowTcpForwarding no
      PermitTunnel no
      MaxAuthTries 3
      LoginGraceTime 20
      ClientAliveInterval 300
      ClientAliveCountMax 2
  notify: Restart sshd

# The CI deploy key.
#
# The nodes authorise one key at provision -- the operator's, from Hetzner
# (admin_ssh_key_ids). CI has no laptop and no such key, so the first CI
# deploy authenticated through the tunnel and Access, then failed at the SSH
# layer with "Permission denied (publickey)". This adds a dedicated deploy key
# so CI can run the same playbook an operator can.
#
# Appended, never replacing: the operator's injected key must survive, so this
# manages exactly its own line and leaves everything else in authorized_keys
# alone. A separate key rather than reusing the operator's means CI can be
# revoked -- delete the line, redeploy -- without touching anyone's laptop
# access. The public half is committed (it is public); the private half lives
# only in the CI secret WG_CI_SSH_KEY.
- name: Authorise the CI deploy key for root
  ansible.builtin.lineinfile:
    path: /root/.ssh/authorized_keys
    line: "{{ ci_deploy_ssh_public_key }}"
    state: present
    create: true
    owner: root
    group: root
    mode: "0600"
  when: ci_deploy_ssh_public_key | default('') | length > 0
