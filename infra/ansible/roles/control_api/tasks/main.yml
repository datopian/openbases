---
# The control API service (WP-C2).
#
# It binds to loopback only. The tunnel connector reaches it from the same host,
# and Cloudflare Access authenticates before any request arrives — but the
# service validates the Access JWT itself rather than trusting that (ADR-0006).

- name: Create the service user
  ansible.builtin.user:
    name: "{{ control_api_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    password_lock: true

- name: Ensure the configuration directory exists
  ansible.builtin.file:
    path: /etc/workgraph
    state: directory
    owner: root
    group: "{{ control_api_user }}"
    mode: "0750"

- name: Install the control API binary
  ansible.builtin.copy:
    src: "{{ control_api_local_binary }}"
    dest: "{{ control_api_binary }}"
    mode: "0755"
    owner: root
    group: root
  when: control_api_local_binary | length > 0
  notify: Restart control-api

- name: Install the budget tool
  ansible.builtin.copy:
    src: "{{ budget_local_binary }}"
    dest: "{{ budget_binary }}"
    mode: "0755"
    owner: root
    group: root
  when: budget_local_binary | length > 0

- name: Install the work queue tool
  ansible.builtin.copy:
    src: "{{ work_local_binary }}"
    dest: "{{ work_binary }}"
    mode: "0755"
    owner: root
    group: root
  when: work_local_binary | length > 0

- name: Install the migration tool
  ansible.builtin.copy:
    src: "{{ migrate_local_binary }}"
    dest: "{{ migrate_binary }}"
    mode: "0755"
    owner: root
    group: root
  when: migrate_local_binary | length > 0

# Credential source files. systemd reads these at start and copies them into a
# per-service tmpfs; the service user never needs to read them itself, which is
# why they are root-only rather than group-readable like the env file.
- name: Ensure the credential directory exists
  ansible.builtin.file:
    path: /etc/workgraph/credentials
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install the service credentials
  ansible.builtin.copy:
    dest: "/etc/workgraph/credentials/{{ item.name }}"
    content: "{{ item.value }}"
    owner: root
    group: root
    # 0400 root-only. systemd runs as root when it loads the credential, so the
    # service user needs no access to the source file at all — only to the copy
    # systemd places in $CREDENTIALS_DIRECTORY.
    mode: "0400"
  loop:
    - name: db_app_password
      value: "{{ postgresql_app_password }}"
    - name: github_webhook_secret
      value: "{{ control_api_github_webhook_secret }}"
    # Set only while a webhook secret rotation is in flight: the outgoing value,
    # accepted alongside the new one so no delivery is rejected while GitHub and
    # this service disagree. Removed on the next deploy once GitHub is signing
    # with the new secret; the API warns on every start while it is present.
    - name: github_webhook_secret_previous
      value: "{{ control_api_github_webhook_secret_previous | default('') }}"
    # Read by workspaced to extract candidates from a registered source. The
    # same token the execution cells use, so extraction lands in the same spend
    # table as agent work and can be compared against it.
    - name: ai_gateway_token
      value: "{{ ai_gateway_token | default('') }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when: item.value | default('') | length > 0
  notify: Restart control-api

# A credential that is no longer managed must not linger. systemd would keep
# loading a stale file, and a rotated-away secret still on disk is exactly what
# revocation is supposed to remove.
- name: Remove credentials that are no longer configured
  ansible.builtin.file:
    path: "/etc/workgraph/credentials/{{ item.name }}"
    state: absent
  loop:
    - name: db_app_password
      value: "{{ postgresql_app_password }}"
    - name: github_webhook_secret
      value: "{{ control_api_github_webhook_secret }}"
    - name: github_webhook_secret_previous
      value: "{{ control_api_github_webhook_secret_previous | default('') }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.value | default('') | length == 0
  notify: Restart control-api

- name: Install the service environment
  ansible.builtin.template:
    src: control-api.env.j2
    dest: /etc/workgraph/control-api.env
    # 0640 root:workgraph — it holds the database password. Readable by the
    # service, by nobody else, and never world-readable.
    owner: root
    group: "{{ control_api_user }}"
    mode: "0640"
  no_log: true
  notify: Restart control-api

# So that the CLIs are usable by a person, not only by systemd. Without it the
# first thing anyone hits at a shell is "no database URL is configured" from a
# binary that is correctly configured.
- name: Install the CLI environment shim
  ansible.builtin.copy:
    src: wg-env
    dest: /usr/local/bin/wg-env
    owner: root
    group: root
    mode: "0755"

# Before the service starts. Migrations are forward-only and idempotent: one
# already applied is checked against its recorded checksum and skipped.
#
# As `postgres` over the unix socket, not as the application role. The
# application role is deliberately not the owner of anything — an owner bypasses
# row-level security unless FORCE is set on every table — so it cannot create
# the objects a migration creates, and a migration run as the app role fails
# with "permission denied for schema public".
#
# Peer authentication over the socket means no password is assembled, passed on
# a command line, or placed in the environment for this.
- name: Apply database migrations
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: >-
      {{ migrate_binary }}
      -dsn postgresql:///{{ postgresql_database }}?host=/var/run/postgresql
  register: migrate_run
  # The tool logs one "applied" line per migration and "database is up to date"
  # when there was nothing to do, so this reports a change only when the schema
  # actually moved.
  changed_when: "'msg=applied' in migrate_run.stdout"
  when: migrate_local_binary | length > 0

- name: Report what the migrations did
  ansible.builtin.debug:
    msg: "{{ migrate_run.stdout_lines | default([]) | select('search', 'applied|up to date|migrations found') | list }}"
  when: migrate_local_binary | length > 0

- name: Install the systemd unit
  ansible.builtin.template:
    src: control-api.service.j2
    dest: /etc/systemd/system/control-api.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart control-api

- name: Enable and start the control API
  ansible.builtin.systemd:
    name: control-api
    enabled: true
    state: started
    daemon_reload: true

# Converge on the RUNNING process, not just on the files.
#
# Handlers run at the end of a play, so a play that fails part-way applies its
# file changes and never fires them. The next run then sees those files as
# already correct, notifies nothing, and the stale process keeps running for
# ever. That is not hypothetical: it happened here. A new binary, unit and
# environment file sat on disk for two days while the old process served
# traffic with the plaintext database URL still in its environment — the very
# thing the systemd credential migration removes. Every file-level check said
# "migrated".
#
# So the deployed binary's mtime is compared against the service's start time,
# and a service older than its own binary is restarted. This converges from a
# half-applied state, which a notify cannot.
- name: Read the deployed binary and the running service
  ansible.builtin.stat:
    path: "{{ control_api_binary }}"
  register: control_api_binary_stat

- name: Read the service start timestamp
  ansible.builtin.command: systemctl show -p ActiveEnterTimestampMonotonic --value control-api
  register: control_api_started
  changed_when: false

- name: Read the system boot time, to compare a monotonic clock against a wall clock
  ansible.builtin.command: awk '/^btime/ {print $2}' /proc/stat
  register: control_api_btime
  changed_when: false

- name: Restart the control API when it is older than its own binary
  ansible.builtin.systemd:
    name: control-api
    state: restarted
  vars:
    # ActiveEnterTimestampMonotonic is microseconds since boot; btime is the
    # boot instant in epoch seconds. Together they give the service's start as
    # an epoch second, comparable with the binary's mtime.
    service_started_epoch: >-
      {{ (control_api_btime.stdout | int) + ((control_api_started.stdout | int) // 1000000) }}
  when:
    - control_api_binary_stat.stat.exists
    - control_api_started.stdout | int > 0
    # A second of slack, so a binary written in the same second as the restart
    # does not cause a restart on every subsequent run.
    - (control_api_binary_stat.stat.mtime | int) > (service_started_epoch | int) + 1

# ---------------------------------------------------------------------------
# Reconciliation (WP-D3)
# ---------------------------------------------------------------------------

- name: Install the reconcile binary
  ansible.builtin.copy:
    src: "{{ control_api_local_reconcile_binary }}"
    dest: "{{ control_api_reconcile_binary }}"
    owner: root
    group: root
    # Owned by root and not writable by the service user: a process that can
    # rewrite its own next invocation is a persistence mechanism.
    mode: "0755"
  # Skipped when no local build is supplied, rather than failing the play.
  #
  # This mattered more than it looks. A failure here aborted the play BEFORE
  # handlers ran, which left the control node with a new binary, a new unit and
  # a new environment file on disk while the OLD process kept running with the
  # old environment — including the plaintext database URL this work exists to
  # remove. Reading the config files said "migrated"; the running process said
  # otherwise, and only /proc/<pid>/environ showed the difference.
  when: control_api_local_reconcile_binary | default('') | length > 0

# The App private key can mint tokens for every installed repository, so its
# mode is part of the security model — the loader refuses a key readable by
# group or other rather than trusting the caller to have got this right.
- name: Install the GitHub App private key
  ansible.builtin.copy:
    src: "{{ control_api_local_github_key }}"
    dest: "{{ control_api_github_key_path }}"
    owner: "{{ control_api_user }}"
    group: "{{ control_api_user }}"
    mode: "0600"
  when: control_api_local_github_key | length > 0
  no_log: true

- name: Install the worker binary
  ansible.builtin.copy:
    src: "{{ control_api_local_worker_binary }}"
    dest: "{{ control_api_worker_binary }}"
    owner: root
    group: root
    mode: "0755"
  when: control_api_local_worker_binary | default('') | length > 0
  notify: Restart the worker

- name: Install the worker unit
  ansible.builtin.template:
    src: workgraph-worker.service.j2
    dest: /etc/systemd/system/workgraph-worker.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart the worker

- name: Check whether the worker binary is present
  ansible.builtin.stat:
    path: "{{ control_api_worker_binary }}"
  register: control_api_worker_stat

# Starting a unit whose ExecStart does not exist produces a restart loop that
# looks exactly like a crashing worker.
- name: Enable the worker
  ansible.builtin.systemd_service:
    name: workgraph-worker.service
    enabled: true
    state: started
    daemon_reload: true
  when: control_api_worker_stat.stat.exists

- name: Install the reconciliation unit and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - workgraph-reconcile.service
    - workgraph-reconcile.timer

- name: Enable the reconciliation timer
  ansible.builtin.systemd_service:
    name: workgraph-reconcile.timer
    enabled: true
    state: started
    daemon_reload: true

# ---------------------------------------------------------------------------
# Google Workspace event subscriptions (WP-H1)
# ---------------------------------------------------------------------------

- name: Install the workspace reconciler binary
  ansible.builtin.copy:
    src: "{{ control_api_local_workspace_binary }}"
    dest: "{{ control_api_workspace_binary }}"
    owner: root
    group: root
    mode: "0755"
  when: control_api_local_workspace_binary | default('') | length > 0

# This key impersonates any user in the domain for Drive and Meet reads, so its
# mode is part of the security model rather than tidiness.
- name: Install the Google service-account key
  ansible.builtin.copy:
    src: "{{ control_api_local_google_key }}"
    dest: "{{ control_api_google_key_path }}"
    owner: "{{ control_api_user }}"
    group: "{{ control_api_user }}"
    mode: "0600"
  when: control_api_local_google_key | default('') | length > 0
  no_log: true

- name: Install the workspace reconciliation unit and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - workgraph-workspace.service
    - workgraph-workspace.timer
  when: control_api_local_workspace_binary | default('') | length > 0

- name: Check whether the workspace reconciler is fully configured
  ansible.builtin.stat:
    path: "{{ control_api_workspace_binary }}"
  register: control_api_workspace_stat

# Enabled only with a binary, a key, a subject and a topic. A timer that fires
# every hour into an immediate failure is noise that trains people to ignore
# the one failure that matters.
- name: Enable the workspace reconciliation timer
  ansible.builtin.systemd_service:
    name: workgraph-workspace.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - control_api_workspace_stat.stat.exists
    - control_api_google_subject | default('') | length > 0
    - control_api_google_topic | default('') | length > 0

# And the other direction, which is the half that was missing.
#
# The gate above only ever enabled. One deploy ran with WG_GOOGLE_SUBJECT in its
# environment and started the timer; every later deploy without it re-templated
# the unit with an empty subject and left the timer running, so the service
# failed hourly on "no delegation subject" — exactly the noise the comment above
# exists to prevent. A conditional that can only turn something on describes an
# intention, not a state.
#
# Stopped as well as disabled: disabling alone leaves the current timer armed,
# so the next fire still fails and the deploy that "fixed" it looks ineffective
# for an hour.
- name: Disable the workspace reconciliation timer when it is not fully configured
  ansible.builtin.systemd_service:
    name: workgraph-workspace.timer
    enabled: false
    state: stopped
    daemon_reload: true
  when: >-
    not control_api_workspace_stat.stat.exists
    or (control_api_google_subject | default('') | length == 0)
    or (control_api_google_topic | default('') | length == 0)

# Said once, at deploy time, where somebody is looking. The alternative is an
# hourly journal entry on a machine nobody is reading, which is how this went
# unnoticed in the first place.
- name: Say that workspace reconciliation is off and why
  ansible.builtin.debug:
    msg: >-
      Workspace reconciliation is disabled:
      {{ 'the reconciler binary is not installed; ' if not control_api_workspace_stat.stat.exists else '' }}
      {{ 'control_api_google_subject is empty (set WG_GOOGLE_SUBJECT to the Workspace user the reconciler impersonates); ' if (control_api_google_subject | default('') | length == 0) else '' }}
      {{ 'control_api_google_topic is empty; ' if (control_api_google_topic | default('') | length == 0) else '' }}
      Drive and Meet sources will not be ingested until this is set.
  when: >-
    not control_api_workspace_stat.stat.exists
    or (control_api_google_subject | default('') | length == 0)
    or (control_api_google_topic | default('') | length == 0)
