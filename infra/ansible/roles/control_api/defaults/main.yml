---
control_api_port: 8080
control_api_user: workgraph
# Left empty, the binary is not deployed and the installed one is left alone, so
# a run without a locally built binary changes nothing rather than failing.
#
# It had no default at all, so `ansible-playbook site.yml` without an explicit
# -e control_api_local_binary=... died with "'control_api_local_binary' is
# undefined" — which is what scripts/ansible_check.sh does, and one of the
# reasons the idempotence check it exists to perform had never run (wg-4h3).
#
# Build with `make build-linux`: ./bin/linux-amd64/control-api. A macOS binary
# from `make build` installs without complaint and then fails to exec.
control_api_local_binary: ""

control_api_binary: /usr/local/bin/workgraph-control-api

# wg-budget, the operator's side of per-bead budgets (wg-qw1). It lives here
# rather than in a role of its own because it needs exactly this role's identity
# and database access: the same DSN, the same credential, one more binary.
#
# The dispatcher on an execution node does NOT use it. It asks the control API,
# which has the same answer and no database credential to hand out.
budget_local_binary: ""
budget_binary: /usr/local/bin/wg-budget

# wg-work, the operator's side of the work queue (WP-E3), on the same reasoning
# as wg-budget: it needs this role's database identity and nothing else.
#
# It also carries `sync-hq`, which projects the HQ graph into work_refs from
# here. That is the one path to a populated Work page that does not depend on an
# execution node being up.
work_local_binary: ""
work_binary: /usr/local/bin/wg-work

# The migration tool, which embeds the migrations rather than reading them from
# a directory — so deploying this binary is deploying the schema.
#
# Applied on every deploy, before the API restarts. Migrations are forward-only,
# each runs in its own transaction, and applying one that is already applied is
# a no-op checked against its recorded checksum. Leaving this to a person meant
# the schema on the node was whatever the last person remembered to run.
migrate_local_binary: ""
migrate_binary: /usr/local/bin/wg-migrate
control_api_reconcile_binary: /usr/local/bin/workgraph-reconcile
# The App private key on the control node. Deployed only when a local source is
# given; reconciliation's resync half is skipped without it, while replay still
# runs — recovering what we already received must not depend on reaching GitHub.
control_api_github_key_path: /etc/workgraph/github-app.pem
control_api_local_github_key: ""
control_api_github_app_id: ""
control_api_github_installation_id: ""
control_api_local_reconcile_binary: ""

# The worker (WP-D3). Projects inbound GitHub deliveries continuously.
#
# Empty means the binary is not deployed and the unit is not started, the same
# pattern as the witness and the monitor: a run without a locally built binary
# changes nothing rather than leaving a unit pointing at a file that is not
# there. Build with `make build-linux`.
control_api_local_worker_binary: ""
control_api_worker_binary: /usr/local/bin/workgraph-worker
# Five seconds. The poll is one indexed query, and the target it exists to meet
# is 60 seconds end to end.
control_api_worker_interval: 5s
# Enough that a backlog drains in a pass or two rather than dribbling out at one
# batch per tick, and small enough that a pass stays short.
control_api_worker_batch: 200

# The outgoing webhook secret, accepted alongside the current one while a
# rotation is in flight. Empty except during that window; see
# docs/runbooks/rotate-a-credential.md.
control_api_github_webhook_secret_previous: ""

# Google Workspace event subscriptions (WP-H1).
#
# Empty means not deployed: no binary, no key, no timer. The same pattern as the
# worker and the witness — a run without a locally built binary changes nothing
# rather than leaving a unit pointing at a file that is not there.
control_api_local_workspace_binary: ""
control_api_workspace_binary: /usr/local/bin/workgraph-workspace
# The service-account key, materialised from SOPS by scripts/with_secrets.sh
# into a directory removed when the shell exits. Never in the repository and
# never in an environment variable as a value.
control_api_local_google_key: "{{ lookup('env', 'GOOGLE_APPLICATION_CREDENTIALS') }}"
control_api_google_key_path: /etc/workgraph/google-events.json
# The Workspace user the reconciler impersonates through domain-wide
# delegation. Delegation is granted against the service account's
# oauth2ClientId, so it survives key rotation.
control_api_google_subject: ""
control_api_google_topic: ""

# The AI Gateway prefix workspaced sends extraction through, without a provider
# segment. Empty means register sources and skip extraction, which is a
# supported mode: the record of what a source WAS must not depend on a model
# being reachable.
# Control-plane inference goes through the INTERNAL gateway, not a cell's. It is
# Workgraph's own work rather than any project's, and sending it through a
# client gateway would put platform spend in a client's budget and a client's
# log store.
control_api_ai_gateway_base_url: >-
  {{ ('https://gateway.ai.cloudflare.com/v1/' ~ cloudflare_account_id ~ '/' ~ ai_gateway_prefix ~ '-internal')
     if (cloudflare_account_id | default('') | length > 0 and ai_gateway_prefix | default('') | length > 0)
     else '' }}
control_api_ai_gateway_token: "{{ ai_gateway_token | default('') }}"

# Where accepted knowledge records are proposed as Markdown (WP-H4).
#
# Empty on purpose. The GitHub App installation does not include
# company-workgraph yet, and a configured repository the App cannot reach makes
# the hourly pass fail rather than skip. Set it to "datopian/company-workgraph"
# once the installation covers it.
control_api_knowledge_repo: ""
control_api_knowledge_base: main
