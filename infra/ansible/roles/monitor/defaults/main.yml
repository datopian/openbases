---
# The platform monitor (WP-I1).
#
# Left empty, the binary is not deployed and the units are not installed, so a
# run without a locally built binary changes nothing rather than removing a
# working service. Build with `make build-linux`, which cross-compiles for the
# node: ./bin/linux-amd64/monitor. A macOS binary from `make build` installs
# without complaint and then fails to exec.
monitor_local_binary: ""
monitor_binary: /usr/local/bin/wg-monitor

# The user the monitor runs as. It shares the control API's identity because it
# needs exactly that identity's database access and no more; giving it its own
# would mean a second credential to rotate for no additional confinement.
#
# A read-only database role would be better still, and is worth doing when one
# exists — the monitor only ever SELECTs, apart from calling the two alert
# functions.
monitor_user: "{{ control_api_user | default('workgraph') }}"

# How often to look. Every five minutes is a compromise: an outage is noticed
# within one cycle, and the checks are three cheap queries, one loopback HTTP
# request and a statfs, so the cost of looking often is negligible.
monitor_interval: 5min

# Where the backup jobs leave their receipts.
monitor_receipt_dir: /var/lib/workgraph/backups

# The backup obligations, as name:max-age.
#
# DECLARED rather than discovered, on purpose: a check that reports on the
# backups it can find treats the total absence of a backup as nothing to say,
# which is the failure that matters most.
#
# Each max age allows for missed runs rather than matching the cadence exactly,
# because a timer that fires a minute late is not an incident:
#
#   beads     snapshot every 15 minutes, so 1h tolerates three misses
#   postgres  base backup daily, so 36h tolerates one miss
#
# The OFF-MACHINE copies are not declared, and that is a judgement rather than an
# oversight. There is no off-machine backup: wg-ohk records that the R2 key
# returns 403 on the backup bucket, so everything is currently on the same
# machine as the thing it protects. Declaring it would produce an alert that can
# never clear until somebody mints a token — and a permanently red alert is how
# the alerting system built in WP-I1 gets ignored, which would cost more than the
# gap it advertises. The gap is tracked as an open P0 bead and stated in
# docs/go-live/BACKUP_AND_RECOVERY.md; it becomes an alert the moment offsite is
# supposed to work.
monitor_backup_streams: >-
  {{ 'beads:1h,postgres:36h,beads-offsite:36h,postgres-offsite:36h'
     if (backup_offsite_enabled | default(false))
     else 'beads:1h,postgres:36h' }}

# Filesystems to measure. The PostgreSQL data directory is listed separately from
# root because on this node they can fill for entirely unrelated reasons, and an
# alert that does not say which one sends the operator to the wrong place.
monitor_mounts: "/,/var/lib/postgresql"

# Thresholds. Configuration rather than constants: the right value differs
# between staging and production, and a threshold that needs a release to change
# is one that gets worked around instead.
monitor_disk_percent: 85
# Three reconciliation periods. workgraph-reconcile.timer fires every 15 minutes,
# so a delivery arriving just after a pass waits nearly that long as a matter of
# course; a threshold at or near the period alerts on healthy operation.
monitor_webhook_backlog_age: 45m
monitor_agent_health_silence: 30m

# How many execution cells should be reporting agent health.
#
# Zero means none is expected, and silence is then correct rather than an alert —
# alerting about an absent component is how a staging environment teaches people
# to mute the channel. Derived from the inventory so that removing a cell updates
# the expectation instead of leaving a permanently failing check.
monitor_expect_cells: "{{ groups['execution'] | default([]) | length }}"
