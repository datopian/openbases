---
# The shared GitHub Actions runner for Datopian repositories.

- name: Refuse to run without a GitHub credential
  ansible.builtin.assert:
    that:
      - (ci_runner_github_app_id | default('') not in ['', 'UNSET']) or
        (ci_runner_github_pat | default('') not in ['', 'UNSET'])
    fail_msg: >-
      No GitHub credential. Set the App (preferred) or a PAT in
      infra/secrets/ci.enc.yaml and run through scripts/with_secrets.sh.
      Without one the runners install and then fail to register, which looks
      like a broken runner rather than a missing secret.

- name: Create the runner user
  ansible.builtin.user:
    name: "{{ ci_runner_user }}"
    system: true
    shell: /bin/bash
    home: "{{ ci_runner_root }}"
    create_home: true

# Not root, and not passwordless sudo either. The runner executes whatever a
# workflow says; the blast radius of a mistake in one should be this user's
# files, not the machine.
- name: Ensure the runner cannot sudo
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ ci_runner_user }}"
    state: absent

- name: Install the packages a runner needs
  ansible.builtin.apt:
    name: [curl, jq, git, unzip, tar, python3, ca-certificates, openssl]
    state: present
    update_cache: true
    cache_valid_time: 3600

# ---------------------------------------------------------------------------
# Docker, for service containers
# ---------------------------------------------------------------------------
#
# Workflows use them — Workgraph's database job needs postgres with pgvector —
# and a runner without Docker cannot run those jobs at all. This is the single
# biggest reason a self-hosted runner surprises people: the hosted images have
# it, and a bare VM does not.
- name: Install Docker
  ansible.builtin.apt:
    name: [docker.io]
    state: present
  when: ci_runner_install_docker | bool

- name: Let the runner use Docker
  ansible.builtin.user:
    name: "{{ ci_runner_user }}"
    groups: docker
    append: true
  when: ci_runner_install_docker | bool

# Membership in the docker group is root-equivalent: a container can mount the
# host filesystem. Recorded rather than glossed, because "the runner cannot
# sudo" above would otherwise read as a stronger claim than it is.
- name: Note the privilege this grants
  ansible.builtin.debug:
    msg: >-
      {{ ci_runner_user }} is in the docker group, which is root-equivalent on
      this host. That is inherent to running service containers; the isolation
      that matters here is that the box holds nothing but CI.
  when: ci_runner_install_docker | bool

# ---------------------------------------------------------------------------
# The runner itself, pinned and verified
# ---------------------------------------------------------------------------
- name: Download the pinned runner
  ansible.builtin.get_url:
    url: "https://github.com/actions/runner/releases/download/v{{ ci_runner_version }}/actions-runner-linux-x64-{{ ci_runner_version }}.tar.gz"
    dest: "{{ ci_runner_root }}/runner.tar.gz"
    checksum: "sha256:{{ ci_runner_sha256 }}"
    owner: "{{ ci_runner_user }}"
    group: "{{ ci_runner_user }}"
    mode: "0644"
  notify: Restart the runners

- name: Install the runner's dependencies
  ansible.builtin.shell:
    cmd: |
      set -e
      d=$(mktemp -d); tar xzf {{ ci_runner_root }}/runner.tar.gz -C "$d"
      "$d/bin/installdependencies.sh"
      rm -rf "$d"
    creates: /usr/lib/x86_64-linux-gnu/libicuuc.so.74

# ---------------------------------------------------------------------------
# Credentials
# ---------------------------------------------------------------------------
- name: Ensure the credential directory exists
  ansible.builtin.file:
    path: /etc/ci-runner/credentials
    state: directory
    owner: root
    group: root
    mode: "0700"

# 0400 root-only: systemd loads these as root and places copies in each unit's
# private tmpfs, so the runner user never reads the source file.
- name: Install the GitHub credentials
  ansible.builtin.copy:
    dest: "/etc/ci-runner/credentials/{{ item.name }}"
    content: "{{ item.value }}"
    owner: root
    group: root
    mode: "0400"
  loop:
    - { name: github_app_id, value: "{{ ci_runner_github_app_id }}" }
    - { name: github_app_installation_id, value: "{{ ci_runner_github_app_installation_id }}" }
    - { name: github_app_private_key, value: "{{ ci_runner_github_app_private_key }}" }
    - { name: github_pat, value: "{{ ci_runner_github_pat }}" }
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when: item.value | default('') not in ['', 'UNSET']
  notify: Restart the runners

- name: Remove credentials that are no longer configured
  ansible.builtin.file:
    path: "/etc/ci-runner/credentials/{{ item.name }}"
    state: absent
  loop:
    - { name: github_app_id, value: "{{ ci_runner_github_app_id }}" }
    - { name: github_app_installation_id, value: "{{ ci_runner_github_app_installation_id }}" }
    - { name: github_app_private_key, value: "{{ ci_runner_github_app_private_key }}" }
    - { name: github_pat, value: "{{ ci_runner_github_pat }}" }
  loop_control:
    label: "{{ item.name }}"
  when: item.value | default('') in ['', 'UNSET']

- name: Install the registration script
  ansible.builtin.copy:
    src: wg-register-runner
    dest: /usr/local/bin/wg-register-runner
    owner: root
    group: root
    mode: "0755"
  notify: Restart the runners

# ---------------------------------------------------------------------------
# One unit per concurrent job
# ---------------------------------------------------------------------------
- name: Install the runner unit
  ansible.builtin.template:
    src: ci-runner@.service.j2
    dest: /etc/systemd/system/ci-runner@.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart the runners

- name: Enable the runners
  ansible.builtin.systemd_service:
    name: "ci-runner@{{ item }}.service"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ range(1, (ci_runner_count | int) + 1) | list }}"

# Docker layers fill the disk quietly, and the first symptom is every
# repository's CI failing at once for reasons that look unrelated to disk.
- name: Prune Docker when the disk gets low
  ansible.builtin.copy:
    dest: /etc/systemd/system/ci-runner-prune.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible.
      [Unit]
      Description=Prune Docker when the runner disk is low

      [Service]
      Type=oneshot
      ExecStart=/bin/bash -c 'free=$(df --output=avail -BG / | tail -1 | tr -dc "0-9"); \
        if [ "$free" -lt {{ ci_runner_docker_prune_below_gb }} ]; then \
          echo "only ${free}G free, pruning"; docker system prune -af --volumes; \
        else echo "${free}G free, nothing to do"; fi'
  when: ci_runner_install_docker | bool
  notify: Reload systemd

- name: Prune on a timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/ci-runner-prune.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible.
      [Unit]
      Description=Check the runner disk hourly

      [Timer]
      OnBootSec=10min
      OnUnitActiveSec=1h
      Persistent=true

      [Install]
      WantedBy=timers.target
  when: ci_runner_install_docker | bool
  notify: Reload systemd

- name: Enable the prune timer
  ansible.builtin.systemd_service:
    name: ci-runner-prune.timer
    enabled: true
    state: started
    daemon_reload: true
  when: ci_runner_install_docker | bool
