---
# The shared GitHub Actions runner for Datopian repositories.

# Pinned, with a checksum, like every other binary this repository installs.
# The runner executes arbitrary workflow code with a token that can register
# more runners for the organisation, so an unverified download is not a
# reasonable risk to take to save a version bump.
ci_runner_version: "2.336.0"
ci_runner_sha256: "04cf0be1aff4c3ec3554466c39124ca250e3effd8873bb7e8d68535aa9505d5d"

ci_runner_user: ghrunner
ci_runner_root: /opt/actions-runner

# How many jobs run at once.
#
# Two on a cx33, because GitHub's standard Linux runner is 2 vCPU and this box
# has 4: matching their shape means a workflow tuned for hosted runners behaves
# the same here. More runners than cores would make every job slower and each
# one look flaky under load, which is worse than queueing.
ci_runner_count: 2

# The organisation and its runner group.
#
# A GROUP rather than the default, so membership is a decision. Any repository
# allowed into the group can execute arbitrary code on this machine, so the
# group is scoped to named repositories and never to "all repositories" — and
# never to public ones, where a fork's pull request would be enough.
ci_runner_org: datopian
ci_runner_group: "Default"

# Labels workflows select with. Deliberately NOT ubuntu-latest: that label
# always routes to GitHub's hosted fleet and cannot be shadowed, so every
# workflow that wants this runner has to say so.
ci_runner_labels: "self-hosted,linux,x64,hetzner"

# Credentials, from infra/secrets/ci.enc.yaml via scripts/with_secrets.sh.
# The App is preferred; the PAT is the fallback so this can start today.
ci_runner_github_app_id: "{{ lookup('env', 'CI_GITHUB_APP_ID') | default('', true) }}"
ci_runner_github_app_installation_id: "{{ lookup('env', 'CI_GITHUB_APP_INSTALLATION_ID') | default('', true) }}"
ci_runner_github_app_private_key: "{{ lookup('env', 'CI_GITHUB_APP_PRIVATE_KEY') | default('', true) }}"
ci_runner_github_pat: "{{ lookup('env', 'CI_GITHUB_PAT') | default('', true) }}"

# Docker, because workflows use service containers — Workgraph's database job
# needs postgres with pgvector, and a runner without Docker simply cannot run it.
ci_runner_install_docker: true

# How much disk to leave before pruning Docker.
#
# Layer buildup is the failure this box will actually have: it fills the disk
# quietly, and the first symptom is every repository's CI failing at once for
# reasons that look unrelated to disk.
ci_runner_docker_prune_below_gb: 20
