---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# Restarted one at a time so CI does not stop entirely mid-deploy: an ephemeral
# runner finishes its current job before exiting, and the others keep serving.
- name: Restart the runners
  ansible.builtin.systemd_service:
    name: "ci-runner@{{ item }}.service"
    state: restarted
    daemon_reload: true
  loop: "{{ range(1, (ci_runner_count | int) + 1) | list }}"
