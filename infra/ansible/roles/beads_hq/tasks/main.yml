---
# The company HQ Beads graph (WP-D2).
#
# It lives on the control node, not an execution node: it holds company
# objectives, commitments, decisions and risks, and must not share a machine
# with untrusted agent workloads (plan sections 1.3, 6.1).

- name: Install the pinned Beads and Dolt binaries
  ansible.builtin.include_tasks: install_binary.yml
  loop:
    - name: dolt
      version: "{{ dolt_version }}"
      url: "https://github.com/dolthub/dolt/releases/download/{{ dolt_version }}/dolt-linux-amd64.tar.gz"
      sha256: "{{ dolt_sha256_linux_amd64 }}"
      binary: dolt
    - name: bd
      version: "{{ beads_version }}"
      url: "https://github.com/gastownhall/beads/releases/download/{{ beads_version }}/beads_{{ beads_version | replace('v','') }}_linux_amd64.tar.gz"
      sha256: "{{ beads_sha256_linux_amd64 }}"
      binary: bd
  loop_control:
    loop_var: tool
    label: "{{ tool.name }} {{ tool.version }}"

- name: Create the graph root
  ansible.builtin.file:
    path: "{{ beads_hq_root }}"
    state: directory
    owner: "{{ beads_hq_user }}"
    group: "{{ beads_hq_user }}"
    # 0750: the service user and root. The HQ graph carries company decisions
    # and commitments, and no other account on this node needs to read them.
    mode: "0750"


# One graph per declared entry (WP-H4).
#
# Was one hard-coded HQ graph. Accepted operational items from a project's
# meetings become Beads, and a restricted client's task text must not land in
# the graph everyone reads -- so each client project gets its own graph, which
# is also what plan section 2.3 assumes when it says Beads databases are
# isolated and cannot reference each other.
#
# Declared rather than derived from the database: this role runs against a host
# and cannot query the control plane, and a graph appearing because a row
# appeared is not a change anybody reviewed.
- name: Provision each declared Beads graph
  ansible.builtin.include_tasks: graph.yml
  loop: "{{ beads_graphs }}"
  loop_control:
    loop_var: graph
    label: "{{ graph.name }}"
