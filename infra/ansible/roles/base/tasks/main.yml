---
# Base OS configuration common to every node.

- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Install base packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - chrony            # time sync; audit timestamps are worthless without it
      - nftables
      - auditd
      - audispd-plugins
      - python3-apt
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable and start chrony
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started

# Security updates apply automatically; reboots do not. An unannounced reboot of
# the execution node kills running agent work, so rebooting is an operator
# decision (plan section 11.3).
- name: Configure unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades-workgraph
    mode: "0644"
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Automatic-Reboot "{{ 'true' if unattended_upgrades_automatic_reboot else 'false' }}";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
  notify: Restart unattended-upgrades

- name: Enable unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# Journald limits keep an incident investigable without filling the disk. A full
# disk on the control node takes down PostgreSQL, which is worse than losing old
# logs.
- name: Ensure the journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Bound journald retention
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-workgraph.conf
    mode: "0644"
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse={{ journald_max_use }}
      MaxRetentionSec={{ journald_max_retention }}
      ForwardToSyslog=no
  notify: Restart journald
