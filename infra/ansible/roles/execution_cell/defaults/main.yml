---
execution_cells: []
cells_root: /srv/cells

# The group that keeps full /proc visibility under hidepid. adm (4) on Debian
# and Ubuntu, which root and administrative tooling belong to.
proc_admin_gid: 4

# Ceiling on how long any agent process may live, enforced by a timer as a
# backstop to the dispatch script's own teardown.
#
# The reaper's backstop: an agent process older than this is killed whatever
# else is or is not running.
#
# Was 45 minutes, on the grounds that "a completed task has taken under three
# minutes". That stopped being true the day agents got a shell: installing
# dependencies and running a build are minutes of wall clock, and sa-7dc's
# useful first run was still working at fifteen.
#
# Now above dispatcher_deadline (3h) rather than below it, because the two have
# swapped roles. The dispatcher stops a run when it STALLS, which is the limit
# that tracks whether work is happening; this is the last resort for an agent
# whose dispatcher has died and which is therefore being watched by nobody.
# check_infra.py asserts the ordering, and caught this file when only one of
# the two numbers had been changed.
#
# The honest cost of the change: a stalled agent whose dispatcher has also died
# now burns up to wg-runner's own 3h deadline instead of 45 minutes. A stalled
# agent is usually not calling a model, and the expensive case -- a loop -- is
# bounded by that same 3h.
agent_max_runtime_minutes: 240

# The deterministic witness (cmd/witness, ADR-0019). It replaces Gas Town's
# Witness patrol agent, which is disabled by the gastown role.
#
# Left empty, the binary is not deployed and the units are not installed, so a
# run without a locally built binary changes nothing rather than removing a
# working service. Build it with `make build-linux`, which cross-compiles for
# the node: ./bin/linux-amd64/witness. A macOS binary from `make build` will
# install without complaint and then fail to exec.
witness_local_binary: ""

# The agent runner (ADR-0023). Left empty, it is not deployed and a run without
# a locally built binary changes nothing rather than removing a working one.
runner_local_binary: ""
runner_binary: /usr/local/bin/wg-runner

# The work-queue dispatcher (WP-D2/E3). Left empty, it is not deployed.
dispatcher_local_binary: ""
dispatcher_binary: /usr/local/bin/wg-dispatcher
dispatcher_rig: sandbox
# Ten seconds. Nothing is waiting on a human timescale, and a claim is one small
# request — but a minute of latency between pressing a button and seeing
# anything happen makes a demo look broken.
dispatcher_interval: 10s

# The role and model tables wg-runner reads (wg-3tp), deployed as
# /etc/workgraph/models.json. These were map literals in Go, so moving a role
# onto a newer model meant a binary release to change four lines of data.
#
# The built-in tables remain the fallback: a node without this file still runs.
# What is deliberately NOT here is the tool allowlist — whether an agent may run
# arbitrary shell is a change to code somebody reviews, not to a data file.
#
# Names are <gateway-provider>/<model> (wg-8e0), the spelling the gateway uses
# and the one that comes back in usage_records.
# The runtime and model the work roles get by default.
#
# OpenCode on GLM 5.3 Flash since 2026-09-07, replacing Claude Code on
# Sonnet 5. ADR-0024 built the runtime abstraction and deliberately left the
# default alone; scripts/model_bakeoff.sh is what moved it, and the numbers are
# the whole argument:
#
#   screen 1 context     glm-5.3-flash 1310720   sonnet-5 200000    both pass
#   screen 2 tool use    both edited the file
#   screen 3 real work   both fixed the boundary  (scored on the EDIT, not prose)
#
#   bakeoff-tools  sonnet-5 6 calls $0.1738   glm 4 calls $0.0015
#   bakeoff-work   sonnet-5 7 calls $0.0994   glm 6 calls $0.0022
#
# $0.2732 against $0.0037 for the same passing result, and every GLM call
# arrived in usage_records carrying role, cell and bead -- which is ADR-0024's
# actual acceptance criterion, because a run that reaches a model untagged is
# worse than one that fails.
#
# What this is NOT evidence of: that GLM matches Sonnet on hard work. The
# screens are an off-by-one and a file edit. It is evidence that it can do the
# work at all, attributably, at a fiftieth of the price -- which is enough to
# make it the default when any run can override it with `-runtime claude
# -model anthropic/claude-sonnet-5` and a bead that needs more can say so.
wg_model_runtimes:
  polecat: opencode
  crew: opencode

wg_model_roles:
  polecat: workers-ai/@cf/zai-org/glm-5.3-flash
  crew: workers-ai/@cf/zai-org/glm-5.3-flash

wg_model_effort:
  polecat: medium
  crew: medium

# Context is a hard filter on which models can be workers, separately from how
# good they are: OpenCode's system prompt is about 19,900 tokens, so a 24k model
# cannot host it and still work (wg-hvb). Output limits are required by OpenCode,
# which otherwise asks for 32000 and a smaller model refuses the whole request.
wg_model_limits:
  anthropic/claude-sonnet-5: {context: 200000, output: 64000}
  anthropic/claude-haiku-4-5: {context: 200000, output: 64000}
  workers-ai/@cf/moonshotai/kimi-k2.7-code: {context: 262144, output: 8192}
  workers-ai/@cf/moonshotai/kimi-k2.6: {context: 262144, output: 8192}
  workers-ai/@cf/deepseek-ai/deepseek-v4-flash-0731: {context: 1310720, output: 8192}
  workers-ai/@cf/zai-org/glm-5.3-flash: {context: 1310720, output: 8192}
  workers-ai/@cf/google/gemma-4-26b-a4b-it: {context: 256000, output: 8192}
# How long one job may take before the dispatcher kills it.
#
# Raised from 15m to 30m on 2026-09-09, when polecat got a shell. The evidence
# is one run: sa-7dc asked for a PortalJS scaffold, and the agent spent roughly
# two minutes on `npm install` alone, wrote a working portal -- components,
# pages, a DCAT generator and its round-trip test -- and was killed at the
# 15-minute mark with the bead still open. The work landed anyway, because
# landing happens after the run, so the pull request was real and the run was
# recorded `failed`.
#
# 15m was the right number for an agent that could only edit files, which is
# what one was until today. Installing dependencies and running a build are
# minutes of wall clock that buy nothing visible, and they now happen inside
# this budget.
#
# Still BELOW agent_max_runtime_minutes (45), deliberately: that is the cell's
# backstop for a forgotten agent, and a job deadline at or above it would make
# the backstop the thing that ends every long run, with no record of which
# limit was hit.
dispatcher_deadline: 3h

# How long a run may produce NOTHING before the dispatcher stops it.
#
# This is the limit that matters, and the one above is now only a backstop.
# Elapsed time was the wrong measurement: three of sa-7dc's four runs on
# 2026-09-09 were killed by it in the middle of real work -- one had installed
# dependencies and written a whole portal and was stopped at fifteen minutes --
# while the run that deserved stopping spent thirty minutes writing no file at
# all and was allowed its full allowance, because elapsed time cannot tell
# those two apart.
#
# Progress is two facts, either sufficient: the agent wrote to its output, or
# it changed a file in its checkout. Ten minutes of neither is not thinking.
dispatcher_stall: 10m
witness_binary: /usr/local/bin/wg-witness
# How often to look at the event channel. This is a readdir, not a model call,
# so the interval is chosen for responsiveness rather than cost.
witness_interval: 45s
# A full pass even when no event has arrived, because not every transition
# emits one — a session killed by the OOM killer leaves nothing behind.
witness_sweep: 10m
# How long a live session may stay silent before the case is called ambiguous
# and handed to a person. Generous, because a polecat running a test suite is
# routinely quiet for minutes and a false stall interrupts real work.
witness_stall_after: 12m

# ---------------------------------------------------------------------------
# Resource limits, DERIVED from what the node actually has (WP-I3)
# ---------------------------------------------------------------------------
#
# The previous limits were absolute numbers written without reference to the
# machine, and both were wrong in the same direction:
#
#   MemoryMax = 8192M on a node with 3819 MiB of RAM. A ceiling above physical
#   memory can never be reached — the kernel exhausts the machine first and the
#   cgroup never intervenes. It read as protective in `systemctl show` and
#   protected nothing.
#
#   CPUQuota = 200% on a 2-core node, for each of two cells. One cell could take
#   the entire machine, leaving nothing for sshd or the tunnel — and the tunnel
#   is the only way in, because the node has no inbound port. A runaway agent
#   could make the box unreachable exactly when you needed to stop it.
#
# So they are computed from discovered facts with an explicit reservation. A
# bigger node gets bigger limits; a limit can no longer exceed the hardware.
#
# The reservation is for the system, not spare capacity: sshd, cloudflared,
# journald, and the deterministic witness all have to keep running while a cell
# is being throttled.
cell_system_reserve_cpu_percent: 25
cell_system_reserve_memory_mb: 1024

# A floor, so a small node produces a small-but-workable cell rather than an
# unusable one. If the arithmetic falls below this the node is too small to host
# the configured number of cells, which is worth failing on rather than papering
# over.
cell_min_cpu_percent: 40
cell_min_memory_mb: 512
