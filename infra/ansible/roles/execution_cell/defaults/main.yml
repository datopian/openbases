---
execution_cells: []
cells_root: /srv/cells

# The group that keeps full /proc visibility under hidepid. adm (4) on Debian
# and Ubuntu, which root and administrative tooling belong to.
proc_admin_gid: 4

# Ceiling on how long any agent process may live, enforced by a timer as a
# backstop to the dispatch script's own teardown.
#
# 45 minutes is generous for the work these cells do — a completed task has
# taken under three minutes — while bounding the cost of a forgotten town to
# roughly one patrol cycle rather than a day.
agent_max_runtime_minutes: 45

# The deterministic witness (cmd/witness, ADR-0019). It replaces Gas Town's
# Witness patrol agent, which is disabled by the gastown role.
#
# Left empty, the binary is not deployed and the units are not installed, so a
# run without a locally built binary changes nothing rather than removing a
# working service. Build it with `make build-linux`, which cross-compiles for
# the node: ./bin/linux-amd64/witness. A macOS binary from `make build` will
# install without complaint and then fail to exec.
witness_local_binary: ""

# The agent runner (ADR-0023). Left empty, it is not deployed and a run without
# a locally built binary changes nothing rather than removing a working one.
runner_local_binary: ""
runner_binary: /usr/local/bin/wg-runner

# The work-queue dispatcher (WP-D2/E3). Left empty, it is not deployed.
dispatcher_local_binary: ""
dispatcher_binary: /usr/local/bin/wg-dispatcher
dispatcher_rig: sandbox
# Ten seconds. Nothing is waiting on a human timescale, and a claim is one small
# request — but a minute of latency between pressing a button and seeing
# anything happen makes a demo look broken.
dispatcher_interval: 10s

# The role and model tables wg-runner reads (wg-3tp), deployed as
# /etc/workgraph/models.json. These were map literals in Go, so moving a role
# onto a newer model meant a binary release to change four lines of data.
#
# The built-in tables remain the fallback: a node without this file still runs.
# What is deliberately NOT here is the tool allowlist — whether an agent may run
# arbitrary shell is a change to code somebody reviews, not to a data file.
#
# Names are <gateway-provider>/<model> (wg-8e0), the spelling the gateway uses
# and the one that comes back in usage_records.
wg_model_runtimes:
  polecat: claude
  crew: claude

wg_model_roles:
  polecat: anthropic/claude-sonnet-5
  crew: anthropic/claude-sonnet-5

wg_model_effort:
  polecat: medium
  crew: medium

# Context is a hard filter on which models can be workers, separately from how
# good they are: OpenCode's system prompt is about 19,900 tokens, so a 24k model
# cannot host it and still work (wg-hvb). Output limits are required by OpenCode,
# which otherwise asks for 32000 and a smaller model refuses the whole request.
wg_model_limits:
  anthropic/claude-sonnet-5: {context: 200000, output: 64000}
  anthropic/claude-haiku-4-5: {context: 200000, output: 64000}
  workers-ai/@cf/moonshotai/kimi-k2.7-code: {context: 262144, output: 8192}
  workers-ai/@cf/moonshotai/kimi-k2.6: {context: 262144, output: 8192}
  workers-ai/@cf/deepseek-ai/deepseek-v4-flash-0731: {context: 131072, output: 8192}
  workers-ai/@cf/zai-org/glm-5.3-flash: {context: 131072, output: 8192}
dispatcher_deadline: 15m
witness_binary: /usr/local/bin/wg-witness
# How often to look at the event channel. This is a readdir, not a model call,
# so the interval is chosen for responsiveness rather than cost.
witness_interval: 45s
# A full pass even when no event has arrived, because not every transition
# emits one — a session killed by the OOM killer leaves nothing behind.
witness_sweep: 10m
# How long a live session may stay silent before the case is called ambiguous
# and handed to a person. Generous, because a polecat running a test suite is
# routinely quiet for minutes and a false stall interrupts real work.
witness_stall_after: 12m

# ---------------------------------------------------------------------------
# Resource limits, DERIVED from what the node actually has (WP-I3)
# ---------------------------------------------------------------------------
#
# The previous limits were absolute numbers written without reference to the
# machine, and both were wrong in the same direction:
#
#   MemoryMax = 8192M on a node with 3819 MiB of RAM. A ceiling above physical
#   memory can never be reached — the kernel exhausts the machine first and the
#   cgroup never intervenes. It read as protective in `systemctl show` and
#   protected nothing.
#
#   CPUQuota = 200% on a 2-core node, for each of two cells. One cell could take
#   the entire machine, leaving nothing for sshd or the tunnel — and the tunnel
#   is the only way in, because the node has no inbound port. A runaway agent
#   could make the box unreachable exactly when you needed to stop it.
#
# So they are computed from discovered facts with an explicit reservation. A
# bigger node gets bigger limits; a limit can no longer exceed the hardware.
#
# The reservation is for the system, not spare capacity: sshd, cloudflared,
# journald, and the deterministic witness all have to keep running while a cell
# is being throttled.
cell_system_reserve_cpu_percent: 25
cell_system_reserve_memory_mb: 1024

# A floor, so a small node produces a small-but-workable cell rather than an
# unusable one. If the arithmetic falls below this the node is too small to host
# the configured number of cells, which is worth failing on rather than papering
# over.
cell_min_cpu_percent: 40
cell_min_memory_mb: 512
