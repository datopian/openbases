---
# Execution cells: the security boundary for agent work (ADR-0002).
#
# A cell is a dedicated Linux user with its own home, its own credentials, and
# cgroup limits. The acceptance criterion for WP-B2 is that an agent user cannot
# reach control-plane data or another cell, so every choice here is about that.

- name: Ensure drop-in directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/systemd/system/user-.slice.d
    - /etc/nftables.d

- name: Create the cells root
  ansible.builtin.file:
    path: "{{ cells_root }}"
    state: directory
    owner: root
    group: root
    # 0711: traversable so a cell can reach its own home, but NOT listable, so
    # one cell cannot enumerate the others. Enumeration alone leaks client names.
    mode: "0711"

# The group has to exist before the user that names it.
#
# ansible.builtin.user creates a matching group automatically ONLY when `group`
# is not given. It IS given below -- deliberately, because the cell user must be
# in exactly one group and that has to be reasserted on every run -- so nothing
# was creating it.
#
# That made the role unable to provision a NEW cell. It worked on every existing
# one because their groups predate the `group:` line, from when the user module
# still auto-created them. Adding client-cdt was the first new cell since, and it
# failed with "Group wgcell_client_cdt does not exist" -- a role that only works
# on the machines it has already run on.
#
# Worth more than the one cell: the plan requires a dedicated cell per restricted
# project, so this blocked every future client engagement.
- name: Create a group per cell
  ansible.builtin.group:
    name: "wgcell_{{ item.name | replace('-', '_') }}"
    system: true
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create a system user per cell
  ansible.builtin.user:
    name: "wgcell_{{ item.name | replace('-', '_') }}"
    home: "{{ cells_root }}/{{ item.name }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: true
    password_lock: true
    # Exactly one group: its own. Enforced on every run rather than set once.
    #
    # Without append: false, a cell user added to another cell's group stays
    # there forever, and the file modes below stop mattering — group-readable is
    # all it takes. Adding a user to a group is a one-line fix during an
    # incident and is never obviously wrong afterwards, which is why this has to
    # be reasserted rather than assumed.
    #
    # Caught by the isolation test: after adding wgcell_oss to the restricted
    # cell's group by hand, a full playbook run restored the directory modes and
    # left the membership in place.
    group: "wgcell_{{ item.name | replace('-', '_') }}"
    groups: []
    append: false
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"

- name: Lock down each cell home
  ansible.builtin.file:
    path: "{{ cells_root }}/{{ item.name }}"
    state: directory
    owner: "wgcell_{{ item.name | replace('-', '_') }}"
    group: "wgcell_{{ item.name | replace('-', '_') }}"
    # 0700: only the owning cell user. This is the line that stops one client's
    # agent reading another client's worktree.
    mode: "0700"
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"

# Only cells that actually have a town. A cell without one has no graph to
# serve, and starting a server there fails on every boot for a reason that has
# nothing to do with the cell being unhealthy.
- name: Find which cells have a town
  ansible.builtin.stat:
    path: "{{ cells_root }}/{{ item.name }}/town"
  register: cell_towns
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"

# ---------------------------------------------------------------------------
# Resource limits, derived from the node (WP-I3)
# ---------------------------------------------------------------------------
#
# Computed once from discovered facts so a limit can never again exceed the
# hardware it is meant to bound. See the role defaults for what went wrong.
# Which cells are actually working, which is what the split should follow.
#
# An equal split assumes equal load, and on this node that assumption was
# plainly false: oss has a town, a dispatcher and every agent run, while
# client-nged and client-cdt have no town, no dispatcher, and were measured at
# 0 MB. The three-way split gave oss 932 MB and reserved 1863 MB for two cells
# using nothing -- and 932 MB is the ceiling that OOM-killed `npm ci` in the
# portaljs rig at 724 MB, and that leaves no room for a browser beside an
# OpenCode process measured at 474 MB.
#
# So a cell with no town gets the floor -- it needs enough to be provisioned
# into, not enough to run agents -- and the cells that do the work share what
# is left.
- name: Work out which cells carry load
  ansible.builtin.set_fact:
    cells_with_a_town: >-
      {{ cell_towns.results | selectattr('stat.exists') | map(attribute='item.name') | list }}

- name: Derive per-cell limits from this node's capacity and where the load is
  ansible.builtin.set_fact:
    # CPU stays an equal share. It is a QUOTA rather than a reservation: an
    # idle cell's quota costs nothing, CPUWeight decides the remainder anyway,
    # and the assertion below has to hold that the total cannot exceed the
    # machine. Memory is the one that had to change, because an unused
    # MemoryMax withholds capacity whether or not anything is running.
    cell_cpu_percent: >-
      {{ [ (((ansible_processor_vcpus | int) * 100 - cell_system_reserve_cpu_percent)
            / (execution_cells | length)) | round | int,
           cell_min_cpu_percent ] | max }}
    # What a working cell gets: everything left after the system reserve and
    # after the floor for each idle cell.
    cell_memory_mb: >-
      {{ [ (((ansible_memtotal_mb | int) - cell_system_reserve_memory_mb
             - (cell_min_memory_mb | int)
               * ((execution_cells | length) - (cells_with_a_town | length)))
            / [ (cells_with_a_town | length), 1 ] | max) | round | int,
           cell_min_memory_mb ] | max }}
    # And what an idle one gets.
    cell_idle_memory_mb: "{{ cell_min_memory_mb | int }}"

- name: Report the derived limits, so a surprising number is visible in the log
  ansible.builtin.debug:
    msg: >-
      {{ ansible_processor_vcpus }} vCPU and {{ ansible_memtotal_mb }} MiB across
      {{ execution_cells | length }} cell(s), {{ cells_with_a_town | length }}
      with a town ({{ cells_with_a_town | join(', ') | default('none', true) }}):
      CPUQuota={{ cell_cpu_percent }}% per cell,
      MemoryMax={{ cell_memory_mb }}M for a cell with a town and
      {{ cell_idle_memory_mb }}M for one without

# A limit above the machine's capacity is not a limit. This is the check that
# would have caught MemoryMax=8192M on a 3819 MiB node before it shipped.
- name: Refuse limits that exceed the hardware
  ansible.builtin.assert:
    that:
      - (cell_memory_mb | int) < (ansible_memtotal_mb | int)
      # The SUM across every cell, which is what the machine actually has to
      # satisfy. Checking one cell was enough while the split was equal; with a
      # weighted split, a per-cell number can look modest while the total
      # overcommits the node -- and an overcommitted total is the same bug as
      # the 8192M ceiling this check was written for, arrived at by addition.
      - ((cell_memory_mb | int) * (cells_with_a_town | length)
         + (cell_idle_memory_mb | int)
           * ((execution_cells | length) - (cells_with_a_town | length)))
        <= ((ansible_memtotal_mb | int) - (cell_system_reserve_memory_mb | int))
      - ((cell_cpu_percent | int) * (execution_cells | length)) <= ((ansible_processor_vcpus | int) * 100)
    fail_msg: >-
      Derived limits exceed the node: {{ cell_memory_mb }}M for each of
      {{ cells_with_a_town | length }} working cell(s) plus
      {{ cell_idle_memory_mb }}M for each of
      {{ (execution_cells | length) - (cells_with_a_town | length) }} idle one(s)
      on a {{ ansible_memtotal_mb }}M machine reserving
      {{ cell_system_reserve_memory_mb }}M, or {{ cell_cpu_percent }}% x
      {{ execution_cells | length }} cells on {{ ansible_processor_vcpus }} vCPU.
      A ceiling above capacity can never fire.
    success_msg: "derived limits fit within the node's capacity"

- name: Install the per-cell slice agents actually run in
  ansible.builtin.template:
    src: wgcell.slice.j2
    dest: "/etc/systemd/system/wgcell-{{ item.item.name }}.slice"
    owner: root
    group: root
    mode: "0644"
  vars:
    cell: "{{ item.item }}"
    cell_has_a_town: "{{ item.stat.exists }}"
  # Over the stat results rather than the cell list, so the template knows
  # whether THIS cell carries load. Every other per-cell unit in this role
  # already loops this way.
  loop: "{{ cell_towns.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  notify: Reload systemd

- name: Start the per-cell slices
  ansible.builtin.systemd_service:
    name: "wgcell-{{ item.name }}.slice"
    state: started
    daemon_reload: true
  # daemon_reload here as well as the handler: a slice whose MemoryMax changed
  # needs systemd to re-read the unit before the new ceiling applies, and the
  # handler fires at the END of the play -- after the agents this is meant to
  # give room to have already been started.
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"

- name: Apply cgroup limits per cell
  ansible.builtin.copy:
    dest: "/etc/systemd/system/user-.slice.d/50-wgcell-{{ item.name }}.conf"
    mode: "0644"
    content: |
      # Managed by Ansible (WP-B2). Limits for cell {{ item.name }}.
      #
      # A build-heavy agent must not be able to starve the node. Plan section
      # 1.3 keeps the control plane off this machine for the same reason.
      # These bound a real LOGIN session as the cell user, which is not how
      # agents start: dispatch runs `su` from a root SSH session, so agent
      # processes land in root's session scope and none of this applies to them.
      # That is what wgcell-<name>.slice is for. This is kept so an interactive
      # login is bounded too, and now uses the derived numbers rather than the
      # absolute ones that exceeded the machine.
      [Slice]
      CPUAccounting=yes
      MemoryAccounting=yes
      CPUQuota={{ cell_cpu_percent }}%
      MemoryMax={{ cell_memory_mb }}M
      TasksMax={{ item.max_processes }}
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd

# Cloud metadata carries the tunnel token placed by cloud-init. An agent that
# can read it can impersonate the tunnel, so no cell user may reach it.
- name: Block cell users from cloud metadata
  ansible.builtin.copy:
    dest: /etc/nftables.d/10-workgraph-metadata.nft
    mode: "0644"
    content: |
      #!/usr/sbin/nft -f
      # Managed by Ansible (WP-B2).
      table inet workgraph {
        chain output {
          type filter hook output priority 0; policy accept;
      {% for cell in execution_cells %}
          # {{ cell.name }}
          meta skuid "wgcell_{{ cell.name | replace('-', '_') }}" ip daddr 169.254.169.254 counter drop
      {% endfor %}
        }
      }
  notify: Reload nftables

- name: Ensure nftables includes the drop-in directory
  ansible.builtin.lineinfile:
    path: /etc/nftables.conf
    line: 'include "/etc/nftables.d/*.nft"'
    state: present
    create: false
  notify: Reload nftables

# Hide other users' processes from each other.
#
# Without hidepid, every cell user can read every process's command line out of
# /proc — and Gas Town passes credentials as tmux -e arguments, so an agent's
# command line literally contains its gateway token. Confirmed on staging: the
# restricted client cell read a process belonging to the open-source cell.
#
# gid is the adm group so that root and administrative tooling keep full
# visibility; hidepid=2 additionally hides the existence of the processes rather
# than only their details, because a process list alone discloses which cells
# are running and what they are working on.
- name: Hide other users processes in /proc
  ansible.posix.mount:
    path: /proc
    src: proc
    fstype: proc
    opts: "rw,nosuid,nodev,noexec,relatime,hidepid=2,gid={{ proc_admin_gid }}"
    state: mounted

# Agent sessions must outlive the session that started them.
#
# Gas Town runs each agent in a tmux server owned by the cell user. Without
# lingering, systemd-logind tears down a user's processes when their last login
# session ends — so an agent dispatched over SSH is killed the moment the
# dispatching connection closes, and unattended dispatch cannot work at all.
#
# Found the obvious way: the polecat session started, and the tmux server was
# gone by the next command.
- name: Allow cell processes to outlive the session that spawned them
  ansible.builtin.command: "loginctl enable-linger wgcell_{{ item.name | replace('-', '_') }}"
  args:
    creates: "/var/lib/systemd/linger/wgcell_{{ item.name | replace('-', '_') }}"
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"

# ---------------------------------------------------------------------------
# Model access (WP-E2)
# ---------------------------------------------------------------------------

- name: Create the cell credential directory
  ansible.builtin.file:
    path: "{{ cells_root }}/{{ item.name }}/.credentials"
    state: directory
    owner: "wgcell_{{ item.name | replace('-', '_') }}"
    group: "wgcell_{{ item.name | replace('-', '_') }}"
    mode: "0700"
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"

# The per-cell model.env is REMOVED, not written (wg-5jf).
#
# It was written to every cell and read by nothing: not the shell profiles, not
# /etc/profile.d, not dispatch_bead.sh, not a systemd unit. Gateway routing comes
# from the cell's Claude Code settings at {cells_root}/{cell}/.claude/settings.json
# — which is the USER-level settings file, because HOME is the cell root — and a
# settings env value overrides the process environment, so it would win even if
# something did source model.env.
#
# So it was dead configuration containing a live gateway token, with comments
# describing careful quoting for a shell that never read it. The cost is not the
# file: it is that the next person debugging agent routing reads it first and is
# misled, which is exactly what happened.
#
# Deleted from cells that already have it rather than merely no longer written,
# because a stale copy on disk misleads just as well as a fresh one.
- name: Remove the unused per-cell model credentials
  ansible.builtin.file:
    path: "{{ cells_root }}/{{ item.name }}/.credentials/model.env"
    state: absent
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"

# ---------------------------------------------------------------------------
# Idle agent backstop
# ---------------------------------------------------------------------------

- name: Install the idle agent reaper
  ansible.builtin.template:
    src: reap-idle-agents.sh.j2
    dest: /usr/local/bin/wg-reap-idle-agents
    owner: root
    group: root
    # Root-owned and not writable by any cell: an agent that can rewrite the
    # thing that kills it is not being limited by it.
    mode: "0755"

# The runner, which replaces the Gas Town polecat lifecycle (ADR-0023).
- name: Install the agent runner
  ansible.builtin.copy:
    src: "{{ runner_local_binary }}"
    dest: "{{ runner_binary }}"
    owner: root
    group: root
    mode: "0755"
  when: runner_local_binary | length > 0
  tags: [binaries, code]

- name: Install the rig Dolt unit for each cell with a town
  ansible.builtin.template:
    src: wg-rig-dolt.service.j2
    dest: "/etc/systemd/system/wg-rig-dolt-{{ item.item.name }}.service"
    owner: root
    group: root
    mode: "0644"
  vars:
    cell: "{{ item.item }}"
  loop: "{{ cell_towns.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stat.exists
  notify: Reload systemd

# A database rather than an agent: it costs no tokens, so it stays up instead of
# being started and stopped around each dispatch — which is what dispatch used to
# attempt, and could not do, because the transient unit it used killed the server
# as soon as the command returned.
- name: Enable the rig Dolt server for each cell with a town
  ansible.builtin.systemd_service:
    name: "wg-rig-dolt-{{ item.item.name }}.service"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ cell_towns.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stat.exists

- name: Ensure the workgraph configuration directory exists
  ansible.builtin.file:
    path: /etc/workgraph
    state: directory
    owner: root
    group: root
    mode: "0755"

# World-readable, and that is correct: it holds no secret, and the cell users
# that run agents have to read it. The credential lives in the cell's own
# 0600 settings file, not here.
- name: Install the role and model catalogue
  ansible.builtin.template:
    src: models.json.j2
    dest: /etc/workgraph/models.json
    owner: root
    group: root
    mode: "0644"
    validate: "python3 -c \"import json,sys; json.load(open(sys.argv[1]))\" %s"

- name: Install the work dispatcher
  ansible.builtin.copy:
    src: "{{ dispatcher_local_binary }}"
    dest: "{{ dispatcher_binary }}"
    owner: root
    group: root
    mode: "0755"
  when: dispatcher_local_binary | length > 0
  # Without these, a new binary sits on disk while the old process keeps
  # running: the task that restarts the dispatcher below is not tagged `code`,
  # so a code-only deploy replaced the file and changed nothing. The witness
  # install has notified its handler all along.
  notify:
    - Find the installed dispatcher units
    - Restart the dispatchers
  tags: [binaries, code]

- name: Install the dispatcher unit for each cell with a town
  ansible.builtin.template:
    src: wg-dispatcher.service.j2
    dest: "/etc/systemd/system/wg-dispatcher-{{ item.item.name }}.service"
    owner: root
    group: root
    mode: "0644"
  vars:
    cell: "{{ item.item }}"
  loop: "{{ cell_towns.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stat.exists
  notify: Reload systemd

- name: Check whether the dispatcher binary is present
  ansible.builtin.stat:
    path: "{{ dispatcher_binary }}"
  register: dispatcher_stat

# The credentials the dispatcher authenticates with are written by the gastown
# role, but only on a run that was given the service-token secret. Asking the
# node whether the file is there is the honest question: a run without the
# secret leaves an existing, working file alone, and gating on the variable
# would then disable a dispatcher that had everything it needed.
- name: Check whether each cell has control-plane credentials
  ansible.builtin.stat:
    path: "{{ cells_root }}/{{ item.name }}/.credentials/control-api.env"
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"
  register: cell_control_creds

# One rig per repository the cell's projects hold (wg-ugb).
#
# 0084 made the node report which repository each rig holds and made dispatch
# refuse when none held the work. This is the other half: the cell gets the rigs
# its projects imply, so a dispatch against an attached repository has somewhere
# to run. Before it, the oss cell had two rigs against twelve repositories.
- name: Install the rig provisioner
  ansible.builtin.template:
    src: wg-provision-rigs.py.j2
    dest: /usr/local/bin/wg-provision-rigs
    owner: root
    group: root
    mode: "0755"
    validate: "python3 -m py_compile %s"

# In the playbook rather than in the dispatcher: creating a rig clones a
# repository and seeds agent infrastructure, minutes of work and gigabytes of
# disk, which belongs in a deploy somebody ran rather than in a fifteen-second
# pass that would start cloning the moment a repository was attached from a
# phone. Run by hand as `wg-provision-rigs <cell>` when that is too slow.
#
# Deliberately not tagged `code`: a code deploy ships binaries in forty seconds
# and cloning twelve repositories does not belong inside that. It runs on a full
# playbook run, which is where a several-minute task is expected.
- name: Give each cell a rig per repository its projects hold
  ansible.builtin.command: "/usr/local/bin/wg-provision-rigs {{ item.item.name }}"
  loop: "{{ cell_towns.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.stat.exists
    - (cell_control_creds.results
       | selectattr('item.name', 'equalto', item.item.name)
       | map(attribute='stat.exists') | first | default(false))
  register: rig_provisioning
  # A change is a rig actually created, which means the summary line has to BE
  # there. Testing only for the absence of "0 created" reported `changed` when
  # the script never got that far -- which is exactly what happened on the first
  # run, where Cloudflare's browser-integrity check refused urllib's default
  # user agent and the deploy passed having provisioned nothing.
  changed_when:
    - "'created' in rig_provisioning.stdout"
    - "'0 created' not in rig_provisioning.stdout"
  # Exit 2 is "could not read the wanted list", so nothing was attempted and the
  # deploy has silently done nothing: that fails. Exit 1 is "some rigs could not
  # be created", which must NOT stop the deploy -- the others were created, and
  # the dispatcher below still needs to start.
  failed_when: rig_provisioning.rc == 2

- name: Report any rig that could not be created
  ansible.builtin.debug:
    msg: "{{ item.stderr_lines }}"
  loop: "{{ rig_provisioning.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.name | default('') }}"
  when:
    - item.stderr_lines | default([]) | length > 0

# Started only when the cell actually has credentials for the control API. A
# dispatcher without them restarts every fifteen seconds and fills the journal
# with the same authentication error, which is how a real failure later gets
# lost in the noise.
- name: Enable the dispatcher for each cell with a town
  ansible.builtin.systemd_service:
    name: "wg-dispatcher-{{ item.item.name }}.service"
    enabled: true
    state: restarted
    daemon_reload: true
  loop: "{{ cell_towns.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.stat.exists
    - dispatcher_stat.stat.exists
    - (cell_control_creds.results
       | selectattr('item.name', 'equalto', item.item.name)
       | map(attribute='stat.exists') | first | default(false))
    # And only once the control API can actually verify what the dispatcher
    # sends. Enabling it before the /v1/node/ Access application exists gives a
    # 401 every fifteen seconds, which buries the real failure when one comes.
    - control_api_cell_work_access_aud | default("") | length > 0

# A measurement tool, not a service: it runs an agent per candidate model and is
# invoked by hand. On the node rather than a workstation because OpenCode merges
# a global config from ~/.config/opencode, which a developer machine has and a
# cell user does not — so a bake-off run on a laptop measures the laptop.
- name: Install the model bake-off script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/model_bakeoff.sh"
    dest: /usr/local/bin/wg-bakeoff
    owner: root
    group: root
    mode: "0755"

- name: Install the reaper timer units
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: wg-reap-idle-agents.service
      content: |
        [Unit]
        Description=Kill agent processes older than the runtime ceiling

        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/wg-reap-idle-agents
    - name: wg-reap-idle-agents.timer
      content: |
        [Unit]
        Description=Periodically reap long-running agent processes

        [Timer]
        # Every ten minutes. Frequent enough that a forgotten town costs one
        # cycle rather than a day, cheap enough to be unnoticeable.
        OnBootSec=5min
        OnUnitActiveSec=10min
        Persistent=true

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"

- name: Enable the reaper timer
  ansible.builtin.systemd_service:
    name: wg-reap-idle-agents.timer
    enabled: true
    state: started
    daemon_reload: true

# ---------------------------------------------------------------------------
# The deterministic witness (ADR-0019)
# ---------------------------------------------------------------------------
#
# Gas Town's Witness is a Claude Code session on a 300-second patrol cycle,
# doing four jobs that are all mechanical. This replaces it with a program that
# reads the same Gas Town outputs and runs the same Gas Town commands, and
# reaches a person — not another model — for the cases that could lose work.
#
# The stock patrol is switched off by the gastown role. Both running at once
# would be two things nuking the same sandboxes.

- name: Install the witness binary
  ansible.builtin.copy:
    src: "{{ witness_local_binary }}"
    dest: "{{ witness_binary }}"
    owner: root
    group: root
    # Root-owned, like the reaper: a cell that can rewrite its own health
    # monitor is not being monitored by it.
    mode: "0755"
  when: witness_local_binary | length > 0
  notify: Restart the witness
  tags: [binaries, code]

# One unit per cell, rendered here -- NOT a systemd template unit.
#
# It was `wg-witness@.service` with `User=wgcell_%i`, and that is broken for
# every cell whose slug contains a dash. systemd substitutes the instance name
# verbatim, so client-nged asked for the user `wgcell_client-nged` while the
# account is `wgcell_client_nged`, and the service died with 217/USER on every
# start. Two of the three cells on this node were affected; oss worked only
# because its name has no dash.
#
# It failed silently, which is the part worth fixing rather than patching. A
# unit in `activating (auto-restart)` produces no alert and no red anywhere,
# so the deterministic witness -- the thing that reaps stalled polecats and
# nukes finished sandboxes -- had not run on either client cell since it was
# installed, and nothing said so.
#
# systemd has no string transform, so `%i` cannot be sanitised. Ansible can,
# and already does for the dispatcher, whose units are rendered per cell for
# exactly this reason. The witness now matches it.
- name: Install the witness unit for each cell
  ansible.builtin.copy:
    dest: "/etc/systemd/system/wg-witness-{{ item.name }}.service"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (ADR-0019). One unit per cell.
      [Unit]
      Description=Deterministic polecat health monitor for cell {{ item.name }}
      After=network-online.target

      [Service]
      # The account name, not the cell slug: they differ whenever the slug has
      # a dash, and getting this wrong is 217/USER on every start.
      User=wgcell_{{ item.name | replace('-', '_') }}
      # HOME matters more than it looks: Dolt segfaults without one, and gt
      # shells out to Dolt. A witness that crashes on start is a witness that
      # is not watching.
      Environment=HOME={{ cells_root }}/{{ item.name }}
      Environment=PATH=/usr/local/bin:/usr/bin:/bin
      # The cell's Access service token, so escalations can reach the control
      # plane. Absent, the witness still runs and logs its findings to the
      # journal rather than failing.
      EnvironmentFile=-{{ cells_root }}/{{ item.name }}/.credentials/control-api.env
      ExecStart={{ witness_binary }} \
        -town {{ cells_root }}/{{ item.name }}/town \
        -cell {{ item.name }} \
        -interval {{ witness_interval }} \
        -sweep {{ witness_sweep }} \
        -stall-after {{ witness_stall_after }} \
        -control-api ${WG_CONTROL_API}
      Restart=always
      RestartSec=30s
      # It reads a town and runs gt. Nothing else on the node is its business.
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ProtectHome=false
      ReadWritePaths={{ cells_root }}/{{ item.name }}

      [Install]
      WantedBy=multi-user.target
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"
  notify:
    - Reload systemd
    - Restart the witness

# The template unit and its instances, removed.
#
# Left behind, `wg-witness@client-nged` stays enabled and keeps restart-looping
# next to the unit that replaces it -- two services for one job, one of them
# permanently failing.
- name: Stop the old templated witness instances
  ansible.builtin.systemd_service:
    name: "wg-witness@{{ item.name }}.service"
    enabled: false
    state: stopped
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: false

- name: Remove the old witness template unit
  ansible.builtin.file:
    path: /etc/systemd/system/wg-witness@.service
    state: absent
  notify: Reload systemd

- name: Check whether the witness binary is present
  ansible.builtin.stat:
    path: "{{ witness_binary }}"
  register: execution_cell_witness_stat

# A cell with no town has nothing to watch.
#
# client-nged and client-cdt hold a bin/ directory and nothing else: the Linux
# accounts and the cgroup limits exist, but no Gas Town was ever created in
# them. The witness exits 1 on a missing town -- correctly, it cannot do its
# job -- and systemd restarts it every 30 seconds forever.
#
# That was hidden behind the 217/USER failure until the unit rename fixed
# that, and it is the same failure either way: a service in
# `activating (auto-restart)` alerts nobody. So the town is a precondition
# here rather than something the service discovers at run time.
- name: Check which cells have a town
  ansible.builtin.stat:
    path: "{{ cells_root }}/{{ item.name }}/town"
  register: execution_cell_town_stat
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [binaries, code]

- name: Enable the witness for each cell that has a town
  ansible.builtin.systemd_service:
    name: "wg-witness-{{ item.item.name }}.service"
    enabled: true
    state: started
    daemon_reload: true
  # Starting a unit whose ExecStart does not exist puts it into a restart loop
  # that looks exactly like a crashing witness. Better to install the unit and
  # leave it stopped until a binary is deployed.
  when:
    - execution_cell_witness_stat.stat.exists
    - item.stat.exists
  loop: "{{ execution_cell_town_stat.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# Stopped rather than left looping, and SAID rather than skipped.
#
# The previous version would have left a dead unit enabled and reported ok for
# both client cells, which is how this went unnoticed in the first place.
- name: Stop the witness on cells with no town
  ansible.builtin.systemd_service:
    name: "wg-witness-{{ item.item.name }}.service"
    enabled: false
    state: stopped
  when: not item.stat.exists
  loop: "{{ execution_cell_town_stat.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  failed_when: false

- name: Say which cells are not being watched
  ansible.builtin.debug:
    msg: >-
      {{ item.item.name }} has no town at {{ cells_root }}/{{ item.item.name }}/town,
      so its witness is stopped and nothing is reaping stalled agents there.
      That is correct for an unprovisioned cell and wrong for a working one --
      if this cell is meant to be running work, its town was never created.
  when: not item.stat.exists
  loop: "{{ execution_cell_town_stat.results }}"
  loop_control:
    label: "{{ item.item.name }}"
