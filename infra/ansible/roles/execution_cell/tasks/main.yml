---
# Execution cells: the security boundary for agent work (ADR-0002).
#
# A cell is a dedicated Linux user with its own home, its own credentials, and
# cgroup limits. The acceptance criterion for WP-B2 is that an agent user cannot
# reach control-plane data or another cell, so every choice here is about that.

- name: Ensure drop-in directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/systemd/system/user-.slice.d
    - /etc/nftables.d

- name: Create the cells root
  ansible.builtin.file:
    path: "{{ cells_root }}"
    state: directory
    owner: root
    group: root
    # 0711: traversable so a cell can reach its own home, but NOT listable, so
    # one cell cannot enumerate the others. Enumeration alone leaks client names.
    mode: "0711"

- name: Create a system user per cell
  ansible.builtin.user:
    name: "wgcell_{{ item.name | replace('-', '_') }}"
    home: "{{ cells_root }}/{{ item.name }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: true
    password_lock: true
    # Exactly one group: its own. Enforced on every run rather than set once.
    #
    # Without append: false, a cell user added to another cell's group stays
    # there forever, and the file modes below stop mattering — group-readable is
    # all it takes. Adding a user to a group is a one-line fix during an
    # incident and is never obviously wrong afterwards, which is why this has to
    # be reasserted rather than assumed.
    #
    # Caught by the isolation test: after adding wgcell_oss to the restricted
    # cell's group by hand, a full playbook run restored the directory modes and
    # left the membership in place.
    group: "wgcell_{{ item.name | replace('-', '_') }}"
    groups: []
    append: false
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"

- name: Lock down each cell home
  ansible.builtin.file:
    path: "{{ cells_root }}/{{ item.name }}"
    state: directory
    owner: "wgcell_{{ item.name | replace('-', '_') }}"
    group: "wgcell_{{ item.name | replace('-', '_') }}"
    # 0700: only the owning cell user. This is the line that stops one client's
    # agent reading another client's worktree.
    mode: "0700"
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"

# ---------------------------------------------------------------------------
# Resource limits, derived from the node (WP-I3)
# ---------------------------------------------------------------------------
#
# Computed once from discovered facts so a limit can never again exceed the
# hardware it is meant to bound. See the role defaults for what went wrong.
- name: Derive per-cell limits from this node's capacity
  ansible.builtin.set_fact:
    cell_cpu_percent: >-
      {{ [ (((ansible_processor_vcpus | int) * 100 - cell_system_reserve_cpu_percent)
            / (execution_cells | length)) | round | int,
           cell_min_cpu_percent ] | max }}
    cell_memory_mb: >-
      {{ [ (((ansible_memtotal_mb | int) - cell_system_reserve_memory_mb)
            / (execution_cells | length)) | round | int,
           cell_min_memory_mb ] | max }}

- name: Report the derived limits, so a surprising number is visible in the log
  ansible.builtin.debug:
    msg: >-
      {{ ansible_processor_vcpus }} vCPU and {{ ansible_memtotal_mb }} MiB across
      {{ execution_cells | length }} cell(s):
      CPUQuota={{ cell_cpu_percent }}% MemoryMax={{ cell_memory_mb }}M per cell

# A limit above the machine's capacity is not a limit. This is the check that
# would have caught MemoryMax=8192M on a 3819 MiB node before it shipped.
- name: Refuse limits that exceed the hardware
  ansible.builtin.assert:
    that:
      - (cell_memory_mb | int) < (ansible_memtotal_mb | int)
      - ((cell_cpu_percent | int) * (execution_cells | length)) <= ((ansible_processor_vcpus | int) * 100)
    fail_msg: >-
      Derived limits exceed the node: {{ cell_memory_mb }}M per cell on a
      {{ ansible_memtotal_mb }}M machine, or {{ cell_cpu_percent }}% x
      {{ execution_cells | length }} cells on {{ ansible_processor_vcpus }} vCPU.
      A ceiling above capacity can never fire.
    success_msg: "derived limits fit within the node's capacity"

- name: Install the per-cell slice agents actually run in
  ansible.builtin.template:
    src: wgcell.slice.j2
    dest: "/etc/systemd/system/wgcell-{{ item.name }}.slice"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd

- name: Start the per-cell slices
  ansible.builtin.systemd_service:
    name: "wgcell-{{ item.name }}.slice"
    state: started
    daemon_reload: true
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"

- name: Apply cgroup limits per cell
  ansible.builtin.copy:
    dest: "/etc/systemd/system/user-.slice.d/50-wgcell-{{ item.name }}.conf"
    mode: "0644"
    content: |
      # Managed by Ansible (WP-B2). Limits for cell {{ item.name }}.
      #
      # A build-heavy agent must not be able to starve the node. Plan section
      # 1.3 keeps the control plane off this machine for the same reason.
      # These bound a real LOGIN session as the cell user, which is not how
      # agents start: dispatch runs `su` from a root SSH session, so agent
      # processes land in root's session scope and none of this applies to them.
      # That is what wgcell-<name>.slice is for. This is kept so an interactive
      # login is bounded too, and now uses the derived numbers rather than the
      # absolute ones that exceeded the machine.
      [Slice]
      CPUAccounting=yes
      MemoryAccounting=yes
      CPUQuota={{ cell_cpu_percent }}%
      MemoryMax={{ cell_memory_mb }}M
      TasksMax={{ item.max_processes }}
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd

# Cloud metadata carries the tunnel token placed by cloud-init. An agent that
# can read it can impersonate the tunnel, so no cell user may reach it.
- name: Block cell users from cloud metadata
  ansible.builtin.copy:
    dest: /etc/nftables.d/10-workgraph-metadata.nft
    mode: "0644"
    content: |
      #!/usr/sbin/nft -f
      # Managed by Ansible (WP-B2).
      table inet workgraph {
        chain output {
          type filter hook output priority 0; policy accept;
      {% for cell in execution_cells %}
          # {{ cell.name }}
          meta skuid "wgcell_{{ cell.name | replace('-', '_') }}" ip daddr 169.254.169.254 counter drop
      {% endfor %}
        }
      }
  notify: Reload nftables

- name: Ensure nftables includes the drop-in directory
  ansible.builtin.lineinfile:
    path: /etc/nftables.conf
    line: 'include "/etc/nftables.d/*.nft"'
    state: present
    create: false
  notify: Reload nftables

# Hide other users' processes from each other.
#
# Without hidepid, every cell user can read every process's command line out of
# /proc — and Gas Town passes credentials as tmux -e arguments, so an agent's
# command line literally contains its gateway token. Confirmed on staging: the
# restricted client cell read a process belonging to the open-source cell.
#
# gid is the adm group so that root and administrative tooling keep full
# visibility; hidepid=2 additionally hides the existence of the processes rather
# than only their details, because a process list alone discloses which cells
# are running and what they are working on.
- name: Hide other users processes in /proc
  ansible.posix.mount:
    path: /proc
    src: proc
    fstype: proc
    opts: "rw,nosuid,nodev,noexec,relatime,hidepid=2,gid={{ proc_admin_gid }}"
    state: mounted

# Agent sessions must outlive the session that started them.
#
# Gas Town runs each agent in a tmux server owned by the cell user. Without
# lingering, systemd-logind tears down a user's processes when their last login
# session ends — so an agent dispatched over SSH is killed the moment the
# dispatching connection closes, and unattended dispatch cannot work at all.
#
# Found the obvious way: the polecat session started, and the tmux server was
# gone by the next command.
- name: Allow cell processes to outlive the session that spawned them
  ansible.builtin.command: "loginctl enable-linger wgcell_{{ item.name | replace('-', '_') }}"
  args:
    creates: "/var/lib/systemd/linger/wgcell_{{ item.name | replace('-', '_') }}"
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"

# ---------------------------------------------------------------------------
# Model access (WP-E2)
# ---------------------------------------------------------------------------

- name: Create the cell credential directory
  ansible.builtin.file:
    path: "{{ cells_root }}/{{ item.name }}/.credentials"
    state: directory
    owner: "wgcell_{{ item.name | replace('-', '_') }}"
    group: "wgcell_{{ item.name | replace('-', '_') }}"
    mode: "0700"
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"

# One credential file per cell, mode 0600.
#
# Be honest about what this buys. Cloudflare cannot scope an AI Gateway token to
# a single gateway, so the same token reaches every gateway in the account and a
# cell that steals another's token gains nothing it did not already have. What
# per-cell files DO give is that a filesystem read in one cell does not hand
# over another's credential, and each can be rotated on its own.
#
# The Anthropic key itself is never here: AI Gateway holds it and forwards.
- name: Install the cell model credentials
  ansible.builtin.template:
    src: cell-model.env.j2
    dest: "{{ cells_root }}/{{ item.name }}/.credentials/model.env"
    owner: "wgcell_{{ item.name | replace('-', '_') }}"
    group: "wgcell_{{ item.name | replace('-', '_') }}"
    mode: "0600"
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when: ai_gateway_token | default("") | length > 0

# ---------------------------------------------------------------------------
# Idle agent backstop
# ---------------------------------------------------------------------------

- name: Install the idle agent reaper
  ansible.builtin.template:
    src: reap-idle-agents.sh.j2
    dest: /usr/local/bin/wg-reap-idle-agents
    owner: root
    group: root
    # Root-owned and not writable by any cell: an agent that can rewrite the
    # thing that kills it is not being limited by it.
    mode: "0755"

- name: Install the reaper timer units
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: wg-reap-idle-agents.service
      content: |
        [Unit]
        Description=Kill agent processes older than the runtime ceiling

        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/wg-reap-idle-agents
    - name: wg-reap-idle-agents.timer
      content: |
        [Unit]
        Description=Periodically reap long-running agent processes

        [Timer]
        # Every ten minutes. Frequent enough that a forgotten town costs one
        # cycle rather than a day, cheap enough to be unnoticeable.
        OnBootSec=5min
        OnUnitActiveSec=10min
        Persistent=true

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"

- name: Enable the reaper timer
  ansible.builtin.systemd_service:
    name: wg-reap-idle-agents.timer
    enabled: true
    state: started
    daemon_reload: true

# ---------------------------------------------------------------------------
# The deterministic witness (ADR-0019)
# ---------------------------------------------------------------------------
#
# Gas Town's Witness is a Claude Code session on a 300-second patrol cycle,
# doing four jobs that are all mechanical. This replaces it with a program that
# reads the same Gas Town outputs and runs the same Gas Town commands, and
# reaches a person — not another model — for the cases that could lose work.
#
# The stock patrol is switched off by the gastown role. Both running at once
# would be two things nuking the same sandboxes.

- name: Install the witness binary
  ansible.builtin.copy:
    src: "{{ witness_local_binary }}"
    dest: "{{ witness_binary }}"
    owner: root
    group: root
    # Root-owned, like the reaper: a cell that can rewrite its own health
    # monitor is not being monitored by it.
    mode: "0755"
  when: witness_local_binary | length > 0
  notify: Restart the witness

- name: Install the witness unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/wg-witness@.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (ADR-0019). One instance per cell: wg-witness@oss.
      [Unit]
      Description=Deterministic polecat health monitor for cell %i
      After=network-online.target

      [Service]
      User=wgcell_%i
      # HOME matters more than it looks: Dolt segfaults without one, and gt
      # shells out to Dolt. A witness that crashes on start is a witness that
      # is not watching.
      Environment=HOME={{ cells_root }}/%i
      Environment=PATH=/usr/local/bin:/usr/bin:/bin
      # The cell's Access service token, so escalations can reach the control
      # plane. Absent, the witness still runs and logs its findings to the
      # journal rather than failing.
      EnvironmentFile=-{{ cells_root }}/%i/.credentials/control-api.env
      ExecStart={{ witness_binary }} \
        -town {{ cells_root }}/%i/town \
        -cell %i \
        -interval {{ witness_interval }} \
        -sweep {{ witness_sweep }} \
        -stall-after {{ witness_stall_after }} \
        -control-api ${WG_CONTROL_API}
      Restart=always
      RestartSec=30s
      # It reads a town and runs gt. Nothing else on the node is its business.
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ProtectHome=false
      ReadWritePaths={{ cells_root }}/%i

      [Install]
      WantedBy=multi-user.target
  notify:
    - Reload systemd
    - Restart the witness

- name: Check whether the witness binary is present
  ansible.builtin.stat:
    path: "{{ witness_binary }}"
  register: execution_cell_witness_stat

- name: Enable the witness for each cell
  ansible.builtin.systemd_service:
    name: "wg-witness@{{ item.name }}.service"
    enabled: true
    state: started
    daemon_reload: true
  # Starting a unit whose ExecStart does not exist puts it into a restart loop
  # that looks exactly like a crashing witness. Better to install the unit and
  # leave it stopped until a binary is deployed.
  when: execution_cell_witness_stat.stat.exists
  loop: "{{ execution_cells }}"
  loop_control:
    label: "{{ item.name }}"
