---
# The pinned Gas Town / Beads / Dolt matrix (versions.lock, plan section 7.6).
#
# The matrix moves together. Gas Town 1.2.0 refuses to run against a newer
# Beads, so a drifted binary here is a real incompatibility rather than an
# untidy one.
gastown_version: "v1.2.0"
gastown_sha256_linux_amd64: "952e5375c451b9e56e1e7e8ade2348562c5f2e495cf01c7e430b5a55fe2f0e63"
beads_version: "v1.0.4"
beads_sha256_linux_amd64: "643e602e27f666c8726abff0f22001e2b5883988fa960204bde20a3129d448a5"
dolt_version: "v2.0.7"
dolt_sha256_linux_amd64: "8e09138596763896cbce0632cd6e779fa1df405334c6c148bc314539a3b9795a"

# Gas Town spawns the Claude Code CLI: its start command is
# `exec claude --dangerously-skip-permissions`. The agent harness is therefore a
# dependency of the orchestrator, not an implementation detail of the model.
claude_code_package: "@anthropic-ai/claude-code"

cells_root: /srv/cells

# Claude Code's first-run prompts. Key names read from the compiled CLI, not
# guessed: an agent left sitting on the theme picker looks exactly like an agent
# that failed to start.
claude_first_run_keys:
  theme: dark
  hasCompletedOnboarding: true
  hasTrustDialogAccepted: true
  bypassPermissionsModeAccepted: true

# Git settings each cell needs for the credential helper to work. The helper
# path is substituted per cell at apply time.
gastown_git_credential_settings:
  - "credential.useHttpPath true"

# Model tier for agent roles (gt config cost-tier).
#
#   standard  every role on Opus — the default, and what produced a $23 bill
#             for one small task
#   economy   patrol roles on Sonnet/Haiku, workers on Opus
#   budget    patrol roles on Haiku, workers on Sonnet
#
# budget, because the spend was never in the work. 372 requests produced 181,667
# output tokens, and almost all of it came from Mayor, Deacon, witness and
# refinery polling continuously — one completed task took under three minutes.
# Paying Opus rates for health checks is the whole problem.
#
# The tier also lowers reasoning effort for patrol roles, which matters more than
# the model choice: output was 89% of tokens and effectively all of the cost.
gastown_cost_tier: budget

# Gas Town patrols to switch off, written to the town's settings/config.json as
# "disabled_patrols" (plan section 4.7, ADR-0019).
#
# A patrol is a persistent Claude Code session driven by a prose formula on a
# 300-second cycle. It runs for as long as the town is up, whether or not any
# work is happening, and on one day of testing the patrol roles made 1,616
# requests and 365,671 output tokens — more than the work they were watching.
#
#   witness   replaced by cmd/witness, which makes the same decisions from
#             `gt polecat list --json` in Go and escalates to the attention
#             inbox. Gas Town kills a leftover session when the patrol is off,
#             so the two cannot both run.
#   handler   not used by this deployment at all.
#
# Deliberately NOT disabled:
#
#   refinery  already event-driven upstream — the daemon logs "No pending
#             refinery events and no session running, skipping spawn" and
#             starts nothing. It costs only when there is a merge to process,
#             which is the behaviour we are trying to achieve everywhere else.
#   deacon    the town-level watchdog. Disabling it is plausible but untested,
#             and a change that removes the last supervisor deserves its own
#             evidence rather than being bundled in.
#
# Verified against gt v1.2.0: the daemon logs "Witness patrol disabled in
# config, skipping". "mayor" is accepted into the list but has no effect — the
# Mayor is not a patrol and the daemon starts it regardless (wg-8yv.51).
gastown_disabled_patrols:
  - witness
  - handler


# The role-to-model map, owned here rather than by `gt config cost-tier`.
#
# The tier preset seeds a brand-new town and is otherwise not re-applied,
# because two owners of one map fight: once any entry differs from the preset,
# `gt config cost-tier` reports "custom" rather than "budget", so a task that
# re-applies the tier whenever it is not "budget" fires on every run and undoes
# the difference. That was observed, not theorised.
#
# These values ARE the budget tier, with one deliberate change: the Mayor moves
# from Sonnet to Haiku. Gas Town starts it unconditionally as the cross-rig
# chief of staff, a job Workgraph does itself (WP-F3), so here it supervises
# nothing — and it was measured at $0.2151 for 75 seconds of an idle town,
# roughly $10 an hour (wg-15m). Its model is the only lever that applies:
# disabled_patrols does not affect it, and `gt mayor stop` holds for about three
# minutes before the daemon heartbeat restarts it.
gastown_role_agents:
  boot: claude-haiku
  crew: claude-sonnet
  deacon: claude-haiku
  dog: claude-haiku
  mayor: claude-haiku
  polecat: claude-sonnet
  refinery: claude-haiku
  witness: claude-haiku

# Reasoning effort per role. This matters more than the model choice did: output
# was 89% of tokens and effectively all of the cost in the first bill.
gastown_role_effort:
  boot: low
  crew: medium
  deacon: low
  dog: low
  mayor: low
  polecat: medium
  refinery: low
  witness: low
