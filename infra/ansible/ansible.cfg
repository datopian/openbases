[defaults]
inventory            = inventory/
roles_path           = roles/
host_key_checking    = True
retry_files_enabled  = False
# yaml output via the built-in default callback; the community.general.yaml
# plugin was removed in collection 12.0.0.
result_format        = yaml
display_skipped_hosts = False
interpreter_python   = /usr/bin/python3
# Establishing the tunnel proxy takes longer than the 10s default, which fails
# with "timed out during banner exchange" and looks like an unreachable host.
timeout              = 60
# Idempotence is an acceptance criterion for WP-B2, so a changed task must be a
# real change. Diff mode makes an unexpected one visible in the run output.
callbacks_enabled    = profile_tasks

[ssh_connection]
pipelining = True
# Retry a failed connection, because the Access token expires every hour.
#
# `cloudflared access ssh` uses a cached per-hostname token, and those are
# minted with a ONE-HOUR life -- measured, not assumed:
#
#     ssh-staging.openbases.com-...-token
#       iat 2026-09-07T13:39:27+00:00
#       exp 2026-09-07T14:39:27+00:00
#
# Every new SSH connection re-invokes cloudflared, so the first one after the
# hour is up fails: cloudflared exits and ssh reports
#
#     Data could not be sent to remote host "ssh-exec-staging.openbases.com".
#     ... Connection closed by UNKNOWN port 65535
#
# UNKNOWN:65535 because the peer is a pipe rather than a socket, which is what
# makes this look like a network fault rather than an expiring credential.
#
# cloudflared mints a fresh host token from the longer-lived org token on its
# next run, without a browser, which is why an immediate re-run always worked.
# So a retry is the actual fix and not a workaround for one: it re-invokes
# cloudflared, which re-authenticates. Three, because the failure is a single
# expiry rather than an outage (wg-r9i).
retries = 3
# Reach the host through Cloudflare Tunnel. No inbound port is open; cloudflared
# proxies the connection over the tunnel the host itself dialled out on.
# No service token appears here. cloudflared reads TUNNEL_SERVICE_TOKEN_ID and
# TUNNEL_SERVICE_TOKEN_SECRET from the environment, so the same ProxyCommand
# serves an operator with a browser session and an unattended run in CI. Passing
# a second --ssh-common-args ProxyCommand instead does NOT work: both are
# supplied to ssh and the first wins, so the interactive one is used and the
# connection hangs until the banner exchange times out.
# Compression=yes because every transfer crosses a cloudflared tunnel whose
# measured throughput was 4MB/s at best and about 88KB/s at worst, and the
# payload is Go binaries, which halve. It applies to file transfers as well as
# the command channel, so it needs no change to any task, and it keeps copy's
# checksum comparison intact — an unchanged binary is still not sent at all.
# On a link this slow the CPU cost of gzip is not close to the trade.
# ServerAliveInterval keeps an ESTABLISHED session from being closed as idle by
# anything between here and the host. A task that runs for minutes without
# writing anything -- provisioning twelve rigs took 288 seconds -- sends no
# traffic on the channel, and a silently dropped session is reported as a lost
# host rather than a timeout. CountMax=6 gives up after three minutes, so a
# genuinely dead connection is detected rather than hung on.
ssh_args = -o ProxyCommand="cloudflared access ssh --hostname %h" -o ControlMaster=auto -o ControlPersist=300s -o Compression=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6
