[defaults]
inventory            = inventory/
roles_path           = roles/
host_key_checking    = True
retry_files_enabled  = False
stdout_callback      = yaml
display_skipped_hosts = False
interpreter_python   = /usr/bin/python3
# Idempotence is an acceptance criterion for WP-B2, so a changed task must be a
# real change. Diff mode makes an unexpected one visible in the run output.
callbacks_enabled    = profile_tasks

[ssh_connection]
pipelining = True
# Reach the host through Cloudflare Tunnel. No inbound port is open; cloudflared
# proxies the connection over the tunnel the host itself dialled out on.
ssh_args = -o ProxyCommand="cloudflared access ssh --hostname %h" -o ControlMaster=auto -o ControlPersist=300s
