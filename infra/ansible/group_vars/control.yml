---
# Inventory data for the control node.
#
# The Beads graphs live here rather than in roles/beads_hq/defaults because TWO
# roles need them and they must not disagree: beads_hq provisions the
# directories, and execution_registry records them in the control plane. Role
# defaults are visible only to their own role, so the second copy would be free
# to drift -- and drift here means the database points at a path nothing
# created.
#
# Same reason execution_cells lives in group_vars/execution.yml rather than in
# the execution_cell role.
beads_hq_root: /srv/graphs

# company-hq carries company-wide decisions; a project graph carries the work
# accepted from that project's meetings.
#
# Prefixes differ so an id says which graph it came from. Beads graphs cannot
# reference each other (plan section 2.3), so a bare id with no prefix is
# ambiguous the moment there is more than one graph -- which is now.
#
# `project` present makes a graph project-scoped and names the project it
# belongs to; absent makes it company-scoped. The registry refuses either half
# of that pair on its own.
beads_graphs:
  - name: company-hq
    prefix: wg
  - name: project-cdt
    prefix: cdt
    project: cdt
  - name: project-nged
    prefix: ngd
    project: nged
