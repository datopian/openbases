# Secrets, taken from the environment rather than the command line.
#
# The deploy runs through scripts/with_secrets.sh, which decrypts
# infra/secrets/<env>.enc.yaml and exports the values into one child process:
#
#   scripts/with_secrets.sh staging \
#     ansible-playbook -i inventory/staging.yml site.yml
#
# Why the environment and not `-e key=value`: extra-vars appear in the process
# arguments, so every secret is visible in `ps` to any user on the machine
# running the deploy, and in whatever shell history recorded the command. That
# was the previous mechanism and it is what WP-B3 removes.
#
# Why not vars_files pointing at the encrypted file: that needs the
# community.sops collection wherever anyone deploys from, and the values would
# still reach Ansible's fact cache and its -vvv output. One decryption into one
# process is a smaller surface than a lookup Ansible can log.
#
# Every default is empty rather than absent. An undefined variable fails with a
# Jinja error far from the cause; an empty one lets the task that needs it skip,
# or fail with a message naming the credential.

# Cloudflare, for the AI Gateway configuration the gastown role applies.
ai_gateway_token: "{{ lookup('env', 'WG_AI_GATEWAY_TOKEN') }}"
cloudflare_account_id: "{{ lookup('env', 'CLOUDFLARE_ACCOUNT_ID') }}"

# The gateway naming prefix. Not a secret, but meaningless apart from the
# account id it sits next to.
ai_gateway_prefix: "workgraph-{{ control_api_environment | default('staging') }}"

# PostgreSQL. This becomes a systemd credential on the control node rather than
# part of a DSN in the service environment.
postgresql_app_password: "{{ lookup('env', 'WG_DB_APP_PASSWORD') }}"

# The GitHub App. The ids are identifiers; only the webhook secret and the
# private key are credentials.
control_api_github_app_id: "{{ lookup('env', 'GITHUB_APP_ID') }}"
control_api_github_installation_id: "{{ lookup('env', 'GITHUB_APP_INSTALLATION_ID') }}"
control_api_github_webhook_secret: "{{ lookup('env', 'GITHUB_WEBHOOK_SECRET') }}"
control_api_local_github_key: "{{ lookup('env', 'GITHUB_APP_PRIVATE_KEY_PATH') }}"

# Cloudflare Access audiences. Identifiers, not credentials — an AUD names an
# application and authorises nothing (see /.gitleaks.toml).
control_api_access_aud: "{{ lookup('env', 'WG_ACCESS_AUD_STAGING') }}"

# Environment configuration that was previously typed on the command line at
# every deploy, which is how a value ends up different between two runs and how
# the last person's shell history becomes the source of truth. None of it is
# secret: a team domain is public, and an AUD names an Access application
# without authorising anything.
control_api_environment: staging
control_api_access_team_domain: datopian.cloudflareaccess.com

# The AUDs of the two path-scoped Access applications the cells use. Terraform
# emits both as outputs (cell_token_mint_aud, cell_agent_health_aud); these are
# the staging values.
control_api_cell_access_aud: 2810c86ee0920b32c24eb112d074d0bf79bea2296a528a171b7fb641f3454fa9
control_api_cell_health_access_aud: fe8561e3a680b4aa6fabf21c1bbced68de6beeaa381958eefb0b8f35453f1b17

# The off-machine backup copy (WP-I2, wg-ohk).
#
# Enabled now that an R2 token covering the backup bucket exists. Until then
# every copy lived on the same disk as the thing it protected.
#
# The credentials come from the environment via scripts/with_secrets.sh, the same
# way the rest of these do, so no key is written into the repository.
backup_offsite_enabled: true
