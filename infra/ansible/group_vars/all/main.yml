# Settings shared by every node. Environment-specific values override these.

# Administrative accounts. Password login is disabled everywhere; these exist so
# that break-glass is attributable to a person rather than to "root".
admin_users: []

# Unattended security updates. Reboots are controlled rather than automatic: an
# unannounced reboot of the execution node kills running agent work.
unattended_upgrades_automatic_reboot: false

# Swap, in MB. 0 disables it.
#
# 4096 on a 4 GB execution node: enough to absorb an `npm ci` peak or a
# `next build` alongside an agent, which is what stopped the node answering
# at all on 2026-09-11. It is a safety net, not sizing -- a box that needs
# swap to finish its ordinary work is a box that wants more memory.
swap_size_mb: 4096

# Journald retention. Enough to investigate an incident without filling the disk.
journald_max_use: 2G
journald_max_retention: 30day
