---
# Which project's work runs in which execution cell (wg-38w).
#
# Policy, not infrastructure, which is why it lives beside the inventory rather
# than in a migration: a migration cannot know that staging has a cell called
# client-nged, and the assignment can differ between environments.
#
# The assignments come from docs/pilot/registry.md, which describes them as
# "proposed rather than specified, and accepted as a starting point".
#
# datopian-products is deliberately ABSENT. It has no cell of its own, and the
# obvious move — put it in the oss cell alongside portaljs-oss — has a cost that
# is easy to miss: a cell hosting two projects cannot attribute its spend to
# either, because system_record_usage resolves a cell tag to a project only when
# exactly one matches and refuses to guess otherwise. Leaving it unassigned says
# "not decided yet", which is true, instead of quietly making the oss cell's
# spend unattributable.
project_cell_assignments:
  - project: portaljs-oss
    cell: oss

  # The tightening 0009 deferred, in its own words: "the schema refuses a
  # restricted project without one, so nged is created as confidential and
  # tightened to restricted when its cell exists". This is when.
  - project: nged
    cell: client-nged
    visibility: restricted

  # CDT, and the same two-step for the same reason: 0050 creates it as
  # confidential because restricted_requires_cell refuses a restricted project
  # with no cell, and this is the line that gives it one and tightens it.
  - project: cdt
    cell: client-cdt
    visibility: restricted

  # MSF runs in the shared oss cell, decided 2026-09-08, and stays there.
  #
  # It sits in the client portfolio, so its own cell -- client-msf, like the two
  # above -- was the first answer. The node cannot host it: per-cell memory is
  # derived from capacity, and a fourth cell takes the oss cell from 1771 MB to
  # 1259 MB idle, or 886 MB once msf carries load. PortalJS `npm ci` was
  # OOM-killed at 932 MB and 1771 MB is what was chosen to fit it, so a fourth
  # working cell breaks the cell that already has work in it. Measured on the
  # node rather than estimated.
  #
  # NO visibility line, deliberately. The two above tighten to restricted
  # because their own cell is what backs the claim. Sharing a cell with
  # open-source work does not, and marking msf restricted here would assert an
  # isolation that is not there -- worse than leaving it internal, because the
  # classification is what other decisions are made from.
  #
  # The cost, stated rather than discovered: oss now hosts twelve projects, so
  # system_record_usage cannot attribute its spend by cell -- it refuses to
  # guess when more than one project matches. Per-BEAD attribution is
  # unaffected, which is what the cost import actually uses; the cell tag was
  # already unattributable with eleven.
  - project: msf
    cell: oss
