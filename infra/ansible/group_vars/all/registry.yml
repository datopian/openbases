---
# Which projects run in which cell is NOT here any more. It is data.
#
# This file used to carry a project-to-cell table, with client names, in a
# repository that is now public. Two things were wrong with that, and they are
# different problems:
#
#   The names. Client project slugs and their cells were configuration in git,
#   so who Datopian works with was in the source tree. Client identifiers are
#   data about the real world and belong in the deployment's database.
#
#   The mechanism. Assigning a project to a cell required an Ansible run. That
#   makes starting a project an infrastructure change, which it is not: it
#   happens on a Tuesday afternoon, from the interface or from MCP, by somebody
#   who should not need a deploy or a person who can run one. A project created
#   through the API got NO cell, could not be dispatched, and the fix was a
#   commit -- which is how eight beads in a newly created project sat
#   undispatchable.
#
# The split that replaced it:
#
#   Infrastructure, and still in git: which cells EXIST, their limits, their
#   trust domains, and which one is `shared` -- see group_vars/execution.yml. A
#   cell is a Linux user with cgroup limits and a credential profile (ADR-0002);
#   creating one means touching the machine.
#
#   Data, and only in the database: which project runs in which cell. Set when
#   the project is created, defaulted to the shared cell by
#   system_default_cell(), and changeable afterwards through the API.
#
# The assignments that used to be listed here are already applied in every
# environment, and nothing unassigns: system_attach_project_to_cell only ever
# sets. Removing them is therefore inert -- it does not detach a project -- and
# the DB has been the source of truth all along. This file was a seeder that
# outlived its job.
#
# The registry document still carries the `projects` array, so an environment
# that genuinely wants to declare an assignment at deploy time can. Nothing
# does, and a new one should not.
project_cell_assignments: []
