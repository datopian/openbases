# Execution nodes run untrusted agent workloads and must isolate them.

# Defined here rather than in the execution_cell role's defaults, because the
# compliance role runs in a separate play and cannot see another role's
# defaults. Both need it, so it belongs to the group.
cells_root: /srv/cells
#
# One cell per trust domain, never per employee (ADR-0002). Each cell gets its
# own Linux user, home, and resource limits, and cannot read another cell's
# files or credentials.
execution_cells:
  # shared: this cell may hold more than one project, and is where work goes
  # when nobody names a cell. A project created through the API or MCP takes it
  # by default, which is what makes "create a project and dispatch work"
  # possible without an Ansible run.
  #
  # Exactly one cell should be shared. system_default_cell() returns nothing
  # when two are, rather than picking, because a project quietly placed in the
  # wrong trust domain is the failure ADR-0002 exists to prevent.
  - name: oss
    shared: true
    trust_domain: oss
    cpu_quota_percent: 200
    memory_limit_mb: 8192
    max_processes: 512
  - name: client-nged
    trust_domain: client-nged
    cpu_quota_percent: 200
    memory_limit_mb: 8192
    max_processes: 512
  # CDT, the second client engagement (wg-8yv.37). Its own cell because the
  # project is restricted, and the schema refuses a restricted project without
  # one -- so this cell is what lets the classification be applied at all.
  #
  # Same limits as the others: they were measured against the node's capacity
  # with the system deliberately outranking every cell, and a third cell at
  # these numbers still leaves headroom. Raising them per cell is the change
  # that quietly makes the node unreachable under load.
  - name: client-cdt
    trust_domain: client-cdt
    cpu_quota_percent: 200
    memory_limit_mb: 8192
    max_processes: 512
