# Credentials for the shared GitHub Actions runner (Datopian org).
#
# A separate file from staging.enc.yaml because it is a separate blast radius:
# these reach the "Github Actions Runner" Hetzner project and the organisation's
# runner registration, and nothing in the Workgraph environments. Keeping them
# apart means a compromise of one does not read the other, and it means this
# file can be shared with whoever maintains CI without handing over the platform.
#
# Encrypted by NAME: .sops.yaml encrypts anything ending in _token, _secret,
# _password, _passphrase, _key or _credential. The identifiers below stay
# readable so a diff is reviewable.
#
# Edit with:
#   SOPS_AGE_KEY_FILE=~/.config/datopian-workgraph/age-workgraph.key \
#     sops infra/secrets/ci.enc.yaml
# The Hetzner project holding ONLY the runners. Must not be the project with the
# Workgraph control and execution nodes: a token can delete every server in its
# project, and CI is the least trusted thing we run.
ci_hcloud_token: ENC[AES256_GCM,data:D5C5fgJkXWfqbg==,iv:W9BS10qk1cXaM+E1rqCkAE8Iz9lyG/EZxL2a05hGPVU=,tag:Ohli9nLH8zEUF/hQPGdE6A==,type:str]
ci_hcloud_location: fsn1
# The organisation the runners register into.
ci_github_org: datopian
# Minting a runner registration token needs organisation permission. The App is
# preferred: its tokens last an hour, a PAT lasts until somebody remembers to
# revoke it.
#
# GitHub App with organization_self_hosted_runners: write, installed on the org.
ci_github_app_id: UNSET
ci_github_app_installation_id: UNSET
ci_github_app_private_key: ENC[AES256_GCM,data:74hvL/4=,iv:YSv6zgVq+gs8zkN/fQojAXLcsL+/UdIRJeOpfx3qze4=,tag:0aeb8pUjDpbqfzQaVv2/6Q==,type:str]
# Fallback so we can start today: a classic PAT with admin:org.
# Set the App above OR this, not both. UNSET rather than empty because an empty
# value is not ciphertext, and check_secrets_encrypted.py correctly refuses a
# credential-named key sitting in clear — even an empty one, since the next
# person to fill it in would not re-encrypt.
ci_github_pat: UNSET
