# The shape of an environment's secrets. Values live elsewhere.
#
# This file is a TEMPLATE and is the only version of it in this public
# repository. It names what a deployment needs; it holds nothing.
#
# The real file is `<environment>.enc.yaml`, SOPS-encrypted, kept outside this
# repository -- see README.md for where and why. Copy this, fill it in, encrypt
# it, and put it there:
#
#   export SOPS_AGE_KEY_FILE=~/.config/datopian-workgraph/age-workgraph.key
#   mkdir -p ~/.config/datopian-workgraph/secrets
#   printf 'environment: staging\n' > /tmp/seed.yaml
#   sops -e --filename-override staging.enc.yaml /tmp/seed.yaml \
#     > ~/.config/datopian-workgraph/secrets/staging.enc.yaml
#   shred -u /tmp/seed.yaml
#   sops ~/.config/datopian-workgraph/secrets/staging.enc.yaml   # fill it in
#
# --filename-override is not optional. SOPS picks its creation_rules from the
# path of the file it is READING, so `sops -e /tmp/staging.yaml` matches no
# rule, encrypts nothing, and writes a file that looks encrypted because it
# still carries a sops block. The override makes it match `*.enc.yaml`.
#
# The last line edits in place through $EDITOR, so the filled-in values never
# touch the disk in clear.
#
# Keys ending in _token, _secret, _password, _passphrase, _key or _credential
# are encrypted by SOPS; everything else is stored in clear. The name decides,
# so name accurately -- scripts/check_secrets_encrypted.py fails the build when
# a credential-shaped value sits in a field that will not be encrypted.

environment: ""   # identifier, stored in clear
portaljs_token: ""   # encrypted
cloudflare_account_id: ""   # identifier, stored in clear
cloudflare_zone_id: ""   # identifier, stored in clear
cloudflare_zone_name: ""   # identifier, stored in clear
github_app_id: ""   # identifier, stored in clear
github_app_installation_id: ""   # identifier, stored in clear
github_app_client_id: ""   # identifier, stored in clear
hcloud_project: ""   # identifier, stored in clear
hcloud_location: ""   # identifier, stored in clear
access_aud_staging: ""   # identifier, stored in clear
hcloud_token: ""   # encrypted
cloudflare_api_token: ""   # encrypted
tofu_state_passphrase: ""   # encrypted
db_app_password: ""   # encrypted
github_webhook_secret: ""   # encrypted
ai_gateway_token: ""   # encrypted
google_workspace_client_secret: ""   # encrypted
r2_access_key_id: ""   # identifier, stored in clear
r2_secret_access_key: ""   # encrypted
github_app_private_key: ""   # encrypted
cost_import_cf_token: ""   # encrypted
google_service_account_key: ""   # encrypted
